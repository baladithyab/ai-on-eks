# NVIDIA Dynamo Platform - Deploys operator, dependencies, and optional components
# v0.8.0 IMPORTANT CHANGES:
# - Request plane: TCP is now DEFAULT (NATS remains for control signals if needed)
# - Discovery: Kubernetes-native is now DEFAULT (etcd available for advanced use cases)
# - Backends: vLLM 0.12.0, SGLang 0.5.6.post2, TensorRT-LLM 1.2.0rc4
# CRDs must be installed first via nvidia-dynamo-crds.yaml (sync-wave: -10)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dynamo-platform
  namespace: argocd
  annotations:
    # Sync-wave 0 ensures platform deploys after CRDs (wave -10)
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.ngc.nvidia.com/nvidia/ai-dynamo
    chart: dynamo-platform
    targetRevision: ${trimprefix(dynamo_version, "v")}
    helm:
      values: |
        # NVIDIA Dynamo Platform Configuration for ai-on-eks using NGC
        # v0.8.0 uses minimal config - chart defaults align with K8s-native approach

        # NGC authentication (required)
        dynamo-operator:
          imagePullSecrets:
            - name: ngc-secret
          %{~ if dynamo_operator_namespace_restriction_enabled ~}
          namespaceRestriction:
            enabled: true
            targetNamespace: dynamo
          %{~ endif ~}
          %{~ if dynamo_model_express_url != "" ~}
          modelExpressURL: ${dynamo_model_express_url}
          %{~ endif ~}
          %{~ if enable_prometheus_endpoint ~}

          # Metrics configuration - auto-inject PROMETHEUS_ENDPOINT env var
          # into all Dynamo services managed by the operator
          # Enabled when enable_ai_ml_observability_stack = true
          dynamo:
            metrics:
              prometheusEndpoint: "http://kube-prometheus-stack-prometheus.kube-prometheus-stack.svc.cluster.local:9090"
          %{~ endif ~}

        # Multi-node orchestration with Grove + Kai Scheduler
        # Grove: Network topology-aware gang scheduling and auto-scaling
        # Kai Scheduler: GPU-aware scheduler with queue management
        #
        # v0.8.0 STATUS: Grove version may have been updated from v0.1.0-alpha.3
        # but cert-rotation behavior requires validation before enabling.
        #
        # RECOMMENDATION: Keep disabled until:
        # 1. Cert-rotation crash loop behavior is confirmed fixed in v0.8.0 Grove
        # 2. Multi-node gang scheduling tested in staging environment
        grove:
          enabled: ${dynamo_enable_grove}

        # Kai Scheduler via Dynamo (v0.9.4)
        # Provides GPU-aware scheduling with queue management
        kai-scheduler:
          enabled: ${dynamo_enable_kai_scheduler}
          global:
            gpuSharing: true
            clusterAutoscaling: true
            leaderElection: false  # Single replica, no HA needed
            nodeSelector:
              NodeGroupType: core
            tolerations:
              - key: "CriticalAddonsOnly"
                operator: "Exists"
          defaultQueue:
            createDefaultQueue: true
            parentName: dynamo-default
            childName: dynamo

        # NATS/etcd Configuration - v0.8.0 DEFAULT: DISABLED
        #
        # v0.8.0 uses TCP request plane + Kubernetes-native discovery by default.
        # NATS and etcd are only needed for legacy compatibility or advanced use cases.
        #
        # To enable legacy mode, set dynamo_enable_nats_etcd = true in blueprint.tfvars
        %{~ if dynamo_enable_nats_etcd ~}

        # LEGACY MODE: NATS enabled for message-queue-based request routing
        # Required for: legacy workloads, complex routing scenarios, JetStream persistence
        nats:
          enabled: true
          config:
            jetstream:
              enabled: true
              fileStore:
                pvc:
                  storageClassName: efs-sc-dynamic
                  size: 10Gi
          # Pod Disruption Budget for NATS cluster stability
          podDisruptionBudget:
            enabled: true
            minAvailable: 1

        # LEGACY MODE: etcd enabled for distributed service discovery
        # Required for: legacy workloads, KV cache routing, external discovery
        etcd:
          enabled: true
          auth:
            token:
              enabled: false
          preUpgradeJob:
            enabled: false
          persistence:
            storageClass: efs-sc-dynamic
            size: 8Gi
          # Pod Disruption Budget for etcd cluster stability
          pdb:
            create: true
            minAvailable: 1
        %{~ else ~}

        # v0.8.0 DEFAULT: NATS disabled - using TCP request plane
        nats:
          enabled: false

        # v0.8.0 DEFAULT: etcd disabled - using Kubernetes-native discovery
        etcd:
          enabled: false
        %{~ endif ~}

        # Use EFS for shared storage (global setting for any component that needs it)
        global:
          storageClass: efs-sc-dynamic
  destination:
    server: https://kubernetes.default.svc
    namespace: dynamo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
  # ignoreDifferences: Prevents ArgoCD from detecting drift on controller-managed fields
  # Critical for webhook caBundle which is populated by cert-manager/controller
  ignoreDifferences:
    # Webhook caBundle is managed by the cluster (injected by cert-manager or controller)
    # ArgoCD should not try to reconcile this as it will drift from Helm template state
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
