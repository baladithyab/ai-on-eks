# =============================================================================
# NVIDIA GPU Operator - ArgoCD Application
# =============================================================================
#
# IMPORTANT: Bottlerocket NVIDIA AMI Compatibility
# ------------------------------------------------
# When using Bottlerocket NVIDIA AMI (aws-k8s-*-nvidia), the GPU Operator
# conflicts with Bottlerocket's built-in NVIDIA components. Bottlerocket
# includes pre-installed:
#   - NVIDIA driver
#   - NVIDIA container toolkit (CDI mode)
#   - NVIDIA device plugin (CDI-CRI mode)
#   - CDI specs at /etc/cdi/nvidia.json
#
# The GPU Operator's device plugin uses different configuration than
# Bottlerocket's built-in components, causing GPU allocation failures.
#
# RECOMMENDATION: Set enable_nvidia_gpu_operator=false in blueprint.tfvars
# when using Bottlerocket NVIDIA AMI and rely on Bottlerocket's built-in
# GPU support instead.
#
# If you must use GPU Operator with Bottlerocket, you need to:
# 1. Disable toolkit (enabled: false) - Bottlerocket has it pre-installed
# 2. Disable device plugin (enabled: false) - Use Bottlerocket's built-in
# 3. Only use GFD, NFD, and DCGM exporter from GPU Operator
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-gpu-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.ngc.nvidia.com/nvidia
    chart: gpu-operator
    targetRevision: "v25.3.1"
    helm:
      values: |
        # Disable driver installation since EKS AMI already has drivers
        driver:
          enabled: false

        # Enable MIG support with mixed strategy
        mig:
          strategy: mixed  # Supports both MIG and non-MIG workloads

        # MIG Manager configuration with embedded MIG profiles
        migManager:
          enabled: true
          env:
            - name: WITH_REBOOT
              value: "true"
          config:
            create: true
            name: custom-mig-parted-configs
            default: "all-disabled"
            data:
              config.yaml: |-
                version: v1
                mig-configs:
                  all-disabled:
                    - devices: all
                      mig-enabled: false

                  # P4D profiles (A100 40GB)
                  # https://docs.nvidia.com/datacenter/tesla/mig-user-guide/index.html#a100-mig-profiles
                  p4d-half-balanced:
                    - devices: [0, 1, 2, 3]
                      mig-enabled: true
                      mig-devices:
                        "1g.5gb": 2
                        "2g.10gb": 1
                        "3g.20gb": 1
                    - devices: [4, 5, 6, 7]
                      mig-enabled: false

                  p4d-all-small:
                    - devices: all
                      mig-enabled: true
                      mig-devices:
                        "1g.5gb": 7

                  p4d-mixed-workload:
                    - devices: [0, 1]
                      mig-enabled: true
                      mig-devices:
                        "1g.5gb": 4
                        "2g.10gb": 1
                    - devices: [2, 3]
                      mig-enabled: true
                      mig-devices:
                        "3g.20gb": 1
                        "1g.5gb": 2
                    - devices: [4, 5, 6, 7]
                      mig-enabled: false

                  p4d-inference-optimized:
                    - devices: [0, 1, 2, 3, 4, 5]
                      mig-enabled: true
                      mig-devices:
                        "1g.5gb": 6
                    - devices: [6, 7]
                      mig-enabled: false

                  # P4DE profiles (A100 80GB)
                  # https://docs.nvidia.com/datacenter/tesla/mig-user-guide/index.html#a100-mig-profiles
                  p4de-half-balanced:
                    - devices: [0, 1, 2, 3]
                      mig-enabled: true
                      mig-devices:
                        "1g.10gb": 2
                        "2g.20gb": 1
                        "3g.40gb": 1
                    - devices: [4, 5, 6, 7]
                      mig-enabled: false

                  p4de-all-small:
                    - devices: all
                      mig-enabled: true
                      mig-devices:
                        "1g.10gb": 7

                  p4de-mixed-workload:
                    - devices: [0, 1]
                      mig-enabled: true
                      mig-devices:
                        "1g.10gb": 3
                        "2g.20gb": 1
                        "3g.40gb": 1
                    - devices: [2, 3]
                      mig-enabled: true
                      mig-devices:
                        "7g.80gb": 1
                    - devices: [4, 5, 6, 7]
                      mig-enabled: false

                  p4de-inference-optimized:
                    - devices: [0, 1, 2, 3, 4, 5]
                      mig-enabled: true
                      mig-devices:
                        "1g.10gb": 4
                        "2g.20gb": 1
                    - devices: [6, 7]
                      mig-enabled: false

                  p4de-training-optimized:
                    - devices: [0, 1]
                      mig-enabled: true
                      mig-devices:
                        "3g.40gb": 1
                        "2g.20gb": 1
                    - devices: [2, 3, 4, 5]
                      mig-enabled: true
                      mig-devices:
                        "7g.80gb": 1
                    - devices: [6, 7]
                      mig-enabled: false

                  # P5 profiles (H100 80GB)
                  # https://docs.nvidia.com/datacenter/tesla/mig-user-guide/index.html#h100-mig-profiles
                  p5-half-balanced:
                    - devices: [0, 1, 2, 3]
                      mig-enabled: true
                      mig-devices:
                        "1g.10gb": 2
                        "2g.20gb": 1
                        "3g.40gb": 1
                    - devices: [4, 5, 6, 7]
                      mig-enabled: false

                  p5-all-small:
                    - devices: all
                      mig-enabled: true
                      mig-devices:
                        "1g.10gb": 7

                  p5-inference-optimized:
                    - devices: [0, 1, 2, 3, 4, 5]
                      mig-enabled: true
                      mig-devices:
                        "1g.10gb": 4
                        "2g.20gb": 1
                    - devices: [6, 7]
                      mig-enabled: false

                  # P6 profiles (B200 180GB)
                  # https://docs.nvidia.com/datacenter/tesla/mig-user-guide/index.html#h200-mig-profiles
                  p6-b200-half-balanced:
                    - devices: [0, 1, 2, 3]
                      mig-enabled: true
                      mig-devices:
                        "1g.23gb": 1
                        "2g.45gb": 1
                        "4g.90gb": 1
                    - devices: [4, 5, 6, 7]
                      mig-enabled: false

                  p6-b200-all-small:
                    - devices: all
                      mig-enabled: true
                      mig-devices:
                        "1g.23gb": 7

                  p6-b200-inference-optimized:
                    - devices: [0, 1, 2, 3, 4, 5]
                      mig-enabled: true
                      mig-devices:
                        "1g.23gb": 5
                        "2g.40gb": 1
                    - devices: [6, 7]
                      mig-enabled: false

        # Device plugin configuration for Bottlerocket
        # Use envvar mode - Bottlerocket's nvidia-container-runtime handles device injection
        # via NVIDIA_VISIBLE_DEVICES environment variable
        devicePlugin:
          enabled: true
          env:
            - name: PASS_DEVICE_SPECS
              value: "true"
            - name: FAIL_ON_INIT_ERROR
              value: "true"
            - name: DEVICE_LIST_STRATEGY
              value: "envvar"
            - name: DEVICE_ID_STRATEGY
              value: "uuid"

        # Disable container toolkit for Bottlerocket
        # Bottlerocket AMI comes with NVIDIA container toolkit pre-installed
        # The toolkit container fails on Bottlerocket due to read-only filesystem
        toolkit:
          enabled: false

        # Node feature discovery
        nfd:
          enabled: true

        # GPU feature discovery
        gfd:
          enabled: true

        # DCGM exporter for monitoring
        dcgmExporter:
          enabled: true
          serviceMonitor:
            enabled: ${service_monitor_enabled}
            interval: 15s
            honorLabels: false
            additionalLabels:
              release: kube-prometheus-stack

        # Node status exporter
        nodeStatusExporter:
          enabled: false

        # Operator configuration
        operator:
          defaultRuntime: containerd
          runtimeClass: nvidia

        # Tolerations and node targeting for all daemonsets
        daemonsets:
          tolerations:
            - key: "nvidia.com/gpu"
              operator: "Exists"
              effect: "NoSchedule"
          # Target only nodes with accelerator: nvidia label (consistent with device plugin)
          nodeSelector:
            karpenter.k8s.aws/instance-gpu-manufacturer: nvidia

        # Resources
        operator:
          resources:
            limits:
              cpu: 500m
              memory: 350Mi
            requests:
              cpu: 200m
              memory: 100Mi

        # Priority class for critical workloads
        daemonsets:
          priorityClassName: system-node-critical

  destination:
    server: https://kubernetes.default.svc
    namespace: gpu-operator
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
