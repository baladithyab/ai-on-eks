#
# Shared HuggingFace Model Cache PVC
# Provides persistent, shared model storage for all Dynamo deployments
# Alternative to Model Express for simpler model caching
#
# Usage in DynamoGraphDeployment:
#   spec:
#     pvcs:
#       - name: dynamo-shared-models
#     envs:
#       - name: HF_HOME
#         value: "/models"
#     services:
#       Worker:
#         volumeMounts:
#           - name: dynamo-shared-models
#             mountPath: /models

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamo-shared-models
  namespace: dynamo
  labels:
    app.kubernetes.io/name: dynamo-shared-cache
    app.kubernetes.io/component: storage
    app.kubernetes.io/managed-by: terraform
  annotations:
    description: "Shared HuggingFace model cache for all Dynamo deployments"
spec:
  accessModes:
    - ReadWriteMany  # Multiple pods across nodes can mount
  storageClassName: ${storage_class}
  resources:
    requests:
      storage: ${cache_size}
