#
# vLLM Disaggregated Deployment for GPT-OSS-20B
#
# OpenAI's GPT-OSS-20B is a smaller reasoning model with tool calling support.
# Uses disaggregated architecture for optimal performance.
#
# Hardware Requirements:
# - 1x g6e.12xlarge (4x L40S, 192GB VRAM total) or similar
# - ~40GB VRAM for 20B model weights (TP=4)
# - Single node deployment
#
# Features:
# - EFS-backed model cache
# - Reasoning parser (gpt_oss) for chain-of-thought
# - Tool call parser (harmony) for function calling
# - Smaller footprint than 120B variant
#
# Use cases:
# - Development and testing of reasoning pipelines
# - Cost-effective reasoning inference
# - Edge deployments where 120B is too large
#
# This is a direct DGD deployment (bypasses DGDR profiling)

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-gptoss-20b-disagg
  namespace: dynamo
spec:
  # Use shared HF cache from EFS
  pvcs:
    - name: dynamo-shared-models
      create: false

  # Set HF_HOME for model caching
  envs:
    - name: HF_HOME
      value: "/models"

  services:
    Frontend:
      componentType: frontend
      replicas: 1
      volumeMounts:
        - name: dynamo-shared-models
          mountPoint: /models
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.8.0

    VllmDecodeWorker:
      componentType: worker
      subComponentType: decode
      replicas: 1
      envs:
        - name: UCX_TLS
          value: "^mm"  # Disable shared memory transport to avoid broadcast deadlock
      volumeMounts:
        - name: dynamo-shared-models
          mountPoint: /models
      resources:
        requests:
          cpu: "16"
          memory: "128Gi"
          gpu: "4"
        limits:
          cpu: "32"
          memory: "256Gi"
          gpu: "4"
      sharedMemory:
        size: 24Gi
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.8.0
          workingDir: /workspace/components/backends/vllm
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
            - --model
            - openai/gpt-oss-20b
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.90"
            - --enforce-eager
            - --tensor-parallel-size
            - "4"
            # GPT-OSS specific parsers for reasoning and tool calls
            - --dyn-reasoning-parser
            - gpt_oss
            - --dyn-tool-call-parser
            - harmony

    VllmPrefillWorker:
      componentType: worker
      subComponentType: prefill
      replicas: 1
      envs:
        - name: UCX_TLS
          value: "^mm"  # Disable shared memory transport to avoid broadcast deadlock
      volumeMounts:
        - name: dynamo-shared-models
          mountPoint: /models
      resources:
        requests:
          cpu: "16"
          memory: "128Gi"
          gpu: "4"
        limits:
          cpu: "32"
          memory: "256Gi"
          gpu: "4"
      sharedMemory:
        size: 24Gi
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.8.0
          workingDir: /workspace/components/backends/vllm
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
            - --model
            - openai/gpt-oss-20b
            - --is-prefill-worker
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.90"
            - --enforce-eager
            - --tensor-parallel-size
            - "4"
            # GPT-OSS specific parsers for reasoning and tool calls
            - --dyn-reasoning-parser
            - gpt_oss
            - --dyn-tool-call-parser
            - harmony