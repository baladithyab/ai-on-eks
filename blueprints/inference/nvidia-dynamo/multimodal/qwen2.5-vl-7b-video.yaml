#
# Qwen2.5-VL 7B Video Processing Deployment
#
# This example demonstrates vision-language model deployment optimized for video understanding.
# Qwen2.5-VL can comprehend videos over 1 hour long with event pinpointing capabilities.
#
# Architecture:
# - EncodeWorker: Processes and encodes video frames with dynamic FPS sampling
# - VLMWorker: Handles prefill phase for combined vision-text understanding with extended context
# - Processor: Manages multimodal input preprocessing with video support
#
# Key Features:
# - Long video understanding (1+ hour videos)
# - Event pinpointing (finding specific moments in videos)
# - Dynamic FPS sampling for efficient video processing
# - Extended context window (64K tokens) for long video sequences
# - Multi-turn video conversations
#
# Requirements:
# - 4 GPUs total (1 for EncodeWorker, 2 for VLMWorker with KVBM, 1 for Processor)
# - HuggingFace token secret (hf-token-secret) for model download
# - Higher memory allocation for video frame processing
#
# Resource Notes:
# - VLMWorker: 2 GPUs + KVBM CPU/Disk offloading (100GB CPU cache + 300GB disk)
# - VLMWorker: 200Gi memory for CPU cache and extended context (64K tokens)
# - EncodeWorker: 32Gi memory for video frame encoding
# - Processor: 32Gi memory for video preprocessing
# - Extended startup probe timeout (30 min) for larger model initialization
# - KVBM three-tier caching: GPU (48GB) → CPU (100GB) → Disk (300GB)
#
# Performance Considerations:
# - max-model-len set to 65536 (64K) for long video sequences
# - gpu-memory-utilization set to 0.90 to balance KV cache and model weights
# - Dynamic FPS sampling reduces token count while maintaining temporal understanding

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: qwen-vl-video
  namespace: dynamo-cloud
spec:
  backendFramework: vllm
  services:
    Frontend:
      dynamoNamespace: qwen-vl-video
      componentType: frontend
      replicas: 1
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.6.0
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"

    EncodeWorker:
      envFromSecret: hf-token-secret
      dynamoNamespace: qwen-vl-video
      componentType: worker
      replicas: 1
      resources:
        requests:
          cpu: "4"
          memory: "32Gi"
        limits:
          gpu: "1"
          memory: "32Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.6.0
          workingDir: /workspace/examples/multimodal
          startupProbe:
            httpGet:
              path: /live
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 180  # 180 * 10s = 30 minutes for video model initialization
          command:
            - /bin/sh
            - -c
          args:
            - python3 components/encode_worker.py --model Qwen/Qwen2.5-VL-7B-Instruct
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"

    VLMWorker:
      envFromSecret: hf-token-secret
      dynamoNamespace: qwen-vl-video
      componentType: worker
      replicas: 1
      resources:
        requests:
          cpu: "16"
          memory: "200Gi"
        limits:
          gpu: "2"
          memory: "250Gi"
      envs:
        # Enable KVBM CPU cache (100GB of host memory for KV cache overflow)
        - name: DYN_KVBM_CPU_CACHE_GB
          value: "100"
        # Enable KVBM disk cache (300GB for long video sequences)
        - name: DYN_KVBM_DISK_CACHE_GB
          value: "300"
        # Enable KVBM metrics for monitoring cache performance
        - name: DYN_KVBM_METRICS
          value: "true"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.6.0
          workingDir: /workspace/examples/multimodal
          startupProbe:
            httpGet:
              path: /live
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 180  # 180 * 10s = 30 minutes for model loading + torch.compile
          command:
            - /bin/sh
            - -c
          args:
            - python3 components/worker.py --model Qwen/Qwen2.5-VL-7B-Instruct --worker-type prefill --max-model-len 65536 --gpu-memory-utilization 0.80 --tensor-parallel-size 2 --connector kvbm
          # Volume mount for disk cache
          volumeMounts:
            - name: kvbm-disk-cache
              mountPath: /tmp/kvbm-cache
        # Volume for disk cache storage (larger for video processing)
        volumes:
          - name: kvbm-disk-cache
            emptyDir:
              sizeLimit: 350Gi
              # For production, use a PersistentVolumeClaim instead:
              # persistentVolumeClaim:
              #   claimName: qwen-vl-video-kvbm-cache-pvc
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"

    Processor:
      envFromSecret: hf-token-secret
      dynamoNamespace: qwen-vl-video
      componentType: worker
      replicas: 1
      resources:
        requests:
          cpu: "4"
          memory: "32Gi"
        limits:
          gpu: "1"
          memory: "32Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.6.0
          workingDir: /workspace/examples/multimodal
          startupProbe:
            httpGet:
              path: /live
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 30
            failureThreshold: 180  # 180 * 10s = 30 minutes for video processor initialization
          command:
            - /bin/sh
            - -c
          args:
            - 'python3 components/processor.py --model Qwen/Qwen2.5-VL-7B-Instruct --prompt-template "<|im_start|>system\nYou are a helpful assistant.<|im_end|>\n<|im_start|>user\n<|vision_start|><|image_pad|><|vision_end|><prompt><|im_end|>\n<|im_start|>assistant\n"'
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"

