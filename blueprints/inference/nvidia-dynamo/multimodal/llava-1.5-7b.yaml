#
# LLaVA 1.5 7B Multimodal Deployment
# Supports image understanding and visual question answering
# Requires 2 GPUs (EncodeWorker + VLMWorker; Processor is CPU-only)
#
# IMPORTANT: Image URL Access Limitations
# - External URLs may return 403 Forbidden (Wikipedia, some CDNs)
# - For production: Use base64-encoded images or internal image URLs
# - Content must be array format: [{"type": "text", ...}, {"type": "image_url", ...}]
# - String format for content is NOT supported for multimodal
#
# Example request format:
# {
#   "model": "llava-hf/llava-1.5-7b-hf",
#   "messages": [{
#     "role": "user",
#     "content": [
#       {"type": "text", "text": "What's in this image?"},
#       {"type": "image_url", "image_url": {"url": "data:image/jpeg;base64,..."}}
#     ]
#   }]
# }

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: llava
  namespace: dynamo-cloud
spec:
  backendFramework: vllm
  services:
    Frontend:
      dynamoNamespace: llava
      componentType: frontend
      replicas: 1
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "4"
          memory: "8Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.7.0

    EncodeWorker:
      envFromSecret: hf-token-secret
      dynamoNamespace: llava
      componentType: worker
      replicas: 1
      resources:
        requests:
          cpu: "4"
          memory: "16Gi"
          gpu: "1"
        limits:
          cpu: "4"
          gpu: "1"
          memory: "16Gi"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.7.0
          workingDir: /workspace/examples/multimodal
          command:
            - /bin/sh
            - -c
          args:
            - python3 components/encode_worker.py --model llava-hf/llava-1.5-7b-hf
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"

    VLMWorker:
      envFromSecret: hf-token-secret
      dynamoNamespace: llava
      componentType: worker
      replicas: 1
      resources:
        requests:
          cpu: "4"
          memory: "16Gi"
          gpu: "1"
        limits:
          cpu: "4"
          gpu: "1"
          memory: "16Gi"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.7.0
          workingDir: /workspace/examples/multimodal
          command:
            - /bin/sh
            - -c
          args:
            - python3 components/worker.py --model llava-hf/llava-1.5-7b-hf --worker-type prefill
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"

    Processor:
      envFromSecret: hf-token-secret
      dynamoNamespace: llava
      componentType: worker
      replicas: 1
      resources:
        requests:
          cpu: "4"
          memory: "16Gi"
        limits:
          cpu: "4"
          memory: "16Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.7.0
          workingDir: /workspace/examples/multimodal
          command:
            - /bin/sh
            - -c
          args:
            - 'python3 components/processor.py --model llava-hf/llava-1.5-7b-hf --prompt-template "USER: <image>\n<prompt> ASSISTANT:"'

