#
# TensorRT-LLM Disaggregated Deployment with ConfigMap
# Uses ConfigMap for engine configuration instead of inline YAML

# ConfigMap containing TensorRT-LLM engine configurations
apiVersion: v1
kind: ConfigMap
metadata:
  name: trtllm-disagg-config
  namespace: dynamo
data:
  decode.yaml: |
    # TensorRT-LLM Decode Worker Configuration
    tensor_parallel_size: 1
    moe_expert_parallel_size: 1
    enable_attention_dp: false
    max_num_tokens: 8192
    trust_remote_code: true
    backend: pytorch
    enable_chunked_prefill: true
    disable_overlap_scheduler: false

    cuda_graph_config:
      max_batch_size: 16

    kv_cache_config:
      free_gpu_memory_fraction: 0.85

    cache_transceiver_config:
      backend: DEFAULT

  prefill.yaml: |
    # TensorRT-LLM Prefill Worker Configuration
    tensor_parallel_size: 1
    moe_expert_parallel_size: 1
    enable_attention_dp: false
    max_num_tokens: 8192
    trust_remote_code: true
    backend: pytorch
    enable_chunked_prefill: true
    # Overlap scheduler not currently supported in prefill only workers
    disable_overlap_scheduler: true

    cuda_graph_config:
      max_batch_size: 16

    kv_cache_config:
      free_gpu_memory_fraction: 0.85

    cache_transceiver_config:
      backend: DEFAULT


# yamllint disable-line rule:document-start
---
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: trtllm-disagg-default
  namespace: dynamo
spec:
  backendFramework: trtllm
  pvcs:
    - name: dynamo-model-cache
      create: false
  services:
    Frontend:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      componentType: frontend
      replicas: 1
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 4Gi
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:0.8.1
          workingDir: /workspace/components/backends/trtllm
          command:
            - /bin/sh
            - -c
          args:
            - python3 -m dynamo.frontend --http-port 8000
    TRTLLMDecodeWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: UCX_TLS
          value: ^mm # Disable shared memory transport to avoid broadcast deadlock
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: worker
      subComponentType: decode
      replicas: 1
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 120
      resources:
        requests:
          cpu: "8"
          memory: 20Gi
          gpu: "1"
        limits:
          cpu: "8"
          memory: 20Gi
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        # Mount ConfigMap as volume
        volumes:
          - name: trtllm-disagg-config
            configMap:
              name: trtllm-disagg-config
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 120
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:0.8.1
          workingDir: /workspace/components/backends/trtllm
          # Mount ConfigMap to engine_configs directory
          volumeMounts:
            - name: trtllm-disagg-config
              mountPath: /workspace/components/backends/trtllm/engine_configs
              readOnly: true
          command:
            - python3
            - -m
            - dynamo.trtllm
          args:
            - --model-path
            - deepseek-ai/DeepSeek-R1-Distill-Llama-8B
            - --served-model-name
            - deepseek-ai/DeepSeek-R1-Distill-Llama-8B
            - --extra-engine-args
            - engine_configs/decode.yaml
            - --disaggregation-mode
            - decode
    TRTLLMPrefillWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: UCX_TLS
          value: ^mm # Disable shared memory transport to avoid broadcast deadlock
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: worker
      subComponentType: prefill
      replicas: 1
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 120
      resources:
        requests:
          cpu: "8"
          memory: 20Gi
          gpu: "1"
        limits:
          cpu: "8"
          memory: 20Gi
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        # Mount ConfigMap as volume
        volumes:
          - name: trtllm-disagg-config
            configMap:
              name: trtllm-disagg-config
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 120
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:0.8.1
          workingDir: /workspace/components/backends/trtllm
          # Mount ConfigMap to engine_configs directory
          volumeMounts:
            - name: trtllm-disagg-config
              mountPath: /workspace/components/backends/trtllm/engine_configs
              readOnly: true
          command:
            - python3
            - -m
            - dynamo.trtllm
          args:
            - --model-path
            - deepseek-ai/DeepSeek-R1-Distill-Llama-8B
            - --served-model-name
            - deepseek-ai/DeepSeek-R1-Distill-Llama-8B
            - --extra-engine-args
            - engine_configs/prefill.yaml
            - --disaggregation-mode
            - prefill
