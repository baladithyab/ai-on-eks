#
# TensorRT-LLM with KV-Aware Router
#
# This example demonstrates cache-aware request routing across multiple worker replicas.
# The router intelligently routes requests to workers that already have relevant KV cache,
# reducing redundant computation and improving throughput.
#
# Key Features:
# - KV-aware routing with overlap scoring
# - 2 worker replicas for load balancing
# - Metrics publishing for router decision-making
#
# Requirements:
# - 2 GPUs (1 per worker replica)
# - HuggingFace token secret (hf-token-secret) for model download

# ConfigMap containing TensorRT-LLM engine configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: trtllm-router-config
  namespace: dynamo
data:
  agg.yaml: |
    # Default TensorRT-LLM Engine Configuration for Router
    tensor_parallel_size: 1
    moe_expert_parallel_size: 1
    enable_attention_dp: false
    max_num_tokens: 8192
    max_batch_size: 16
    trust_remote_code: true
    backend: pytorch
    enable_chunked_prefill: true

    kv_cache_config:
      free_gpu_memory_fraction: 0.85

    cuda_graph_config:
      max_batch_size: 16

# yamllint disable-line rule:document-start
---
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: trtllm-router
  namespace: dynamo
spec:
  backendFramework: trtllm
  pvcs:
    - name: dynamo-model-cache
      create: false
  services:
    Frontend:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: DYN_ROUTER_MODE
          value: kv
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: frontend
      replicas: 1
      # Production-grade health checks with appropriate timeouts
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      # Resource specifications ensure Karpenter provisions appropriate nodes
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 4Gi
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:0.8.1
          workingDir: /workspace/components/backends/trtllm
          command:
            - /bin/sh
            - -c
          args:
            # KV Router Configuration:
            # - router-mode kv: Enable cache-aware routing
            # - kv-overlap-score-weight 1.0: Prioritize cache overlap in routing decisions
            # - router-temperature 0.1: Low temperature for deterministic routing
            - |
              python3 -m dynamo.frontend \
                --http-port 8000 \
                --router-mode kv \
                --kv-overlap-score-weight 1.0 \
                --router-temperature 0.1

    TRTLLMWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: worker
      replicas: 2 # Multiple workers for load balancing and cache distribution
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 30
        failureThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      resources:
        requests:
          cpu: "8"
          memory: 20Gi
          gpu: "1"
        limits:
          cpu: "8"
          memory: 20Gi
          gpu: "1"
      extraPodSpec:
        # Karpenter node selector for GPU provisioning
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        # GPU tolerations for dedicated GPU nodes
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        # Mount ConfigMap as volume
        volumes:
          - name: trtllm-router-config
            configMap:
              name: trtllm-router-config
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 120
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:0.8.1
          workingDir: /workspace/components/backends/trtllm
          # Mount ConfigMap to engine_configs directory
          volumeMounts:
            - name: trtllm-router-config
              mountPath: /workspace/components/backends/trtllm/engine_configs
              readOnly: true
          command:
            - /bin/sh
            - -c
          args:
            # IMPORTANT: --publish-events-and-metrics flag enables router to receive
            # real-time KV cache metrics from workers for optimal routing decisions
            - |
              python3 -m dynamo.trtllm \
                --model-path deepseek-ai/DeepSeek-R1-Distill-Llama-8B \
                --served-model-name deepseek-ai/DeepSeek-R1-Distill-Llama-8B \
                --extra-engine-args engine_configs/agg.yaml \
                --publish-events-and-metrics 2>&1 | tee /tmp/trtllm-worker.log
