#
# SGLang Disaggregated Inference with Mooncake TCP Transfer
# Uses Mooncake transfer engine with TCP fallback for PCIe-only environments (no RDMA/NVLink).
# MC_FORCE_TCP=True forces TCP transport instead of RDMA verbs.
# Uses DeepSeek-R1-Distill-Llama-8B for datacenter-grade reasoning inference

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: sglang-disagg-default
  namespace: dynamo
spec:
  backendFramework: sglang
  pvcs:
    - name: dynamo-model-cache
      create: false
  services:
    Frontend:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: frontend
      replicas: 1
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - exit 0
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 4Gi
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:0.8.1
          workingDir: /workspace/components/backends/sglang
          command: [sh, -c]
          args:
            - python3 -m dynamo.frontend --http-port=8000
    SGLangDecodeWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: MC_FORCE_TCP
          value: "True" # Force Mooncake to use TCP transport (no RDMA required)
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: worker
      subComponentType: decode
      replicas: 1
      livenessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - exit 0
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - exit 0
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      resources:
        requests:
          cpu: "8"
          memory: 20Gi
          gpu: "1"
        limits:
          cpu: "8"
          memory: 20Gi
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:0.8.1
          workingDir: /workspace/components/backends/sglang
          command:
            - /bin/sh
            - -c
          args:
            - |
              export LD_LIBRARY_PATH=/usr/local/nvidia/lib64:$LD_LIBRARY_PATH
              export PATH=$PATH:/usr/local/nvidia/bin:/usr/local/nvidia/lib64
              exec python3 -m dynamo.sglang \
                --model-path deepseek-ai/DeepSeek-R1-Distill-Llama-8B \
                --served-model-name deepseek-ai/DeepSeek-R1-Distill-Llama-8B \
                --page-size 16 \
                --tp 1 \
                --trust-remote-code \
                --skip-tokenizer-init \
                --disaggregation-mode decode \
                --disaggregation-transfer-backend mooncake \
                --disaggregation-bootstrap-port 12345 \
                --host 0.0.0.0
    SGLangPrefillWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: MC_FORCE_TCP
          value: "True" # Force Mooncake to use TCP transport (no RDMA required)
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: worker
      subComponentType: prefill
      replicas: 1
      livenessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - exit 0
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - exit 0
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      resources:
        requests:
          cpu: "8"
          memory: 20Gi
          gpu: "1"
        limits:
          cpu: "8"
          memory: 20Gi
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:0.8.1
          workingDir: /workspace/components/backends/sglang
          command:
            - /bin/sh
            - -c
          args:
            - |
              export LD_LIBRARY_PATH=/usr/local/nvidia/lib64:$LD_LIBRARY_PATH
              export PATH=$PATH:/usr/local/nvidia/bin:/usr/local/nvidia/lib64
              exec python3 -m dynamo.sglang \
                --model-path deepseek-ai/DeepSeek-R1-Distill-Llama-8B \
                --served-model-name deepseek-ai/DeepSeek-R1-Distill-Llama-8B \
                --page-size 16 \
                --tp 1 \
                --trust-remote-code \
                --skip-tokenizer-init \
                --disaggregation-mode prefill \
                --disaggregation-transfer-backend mooncake \
                --disaggregation-bootstrap-port 12345 \
                --host 0.0.0.0
