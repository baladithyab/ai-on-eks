apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: sglang-router
  namespace: dynamo-system
spec:
  backendFramework: sglang
  pvcs:
    - name: dynamo-model-cache
      create: false
  services:
    Frontend:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: DYN_ROUTER_MODE
          value: kv
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: frontend
      replicas: 1
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 4Gi
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.0.1
          workingDir: /workspace/components/backends/sglang
          command:
            - /bin/sh
            - -c
          args:
            - |
              python3 -m dynamo.frontend \
                --http-port 8000 \
                --router-mode kv \
                --kv-overlap-score-weight 1.0 \
                --router-temperature 0.1
    SGLangWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: worker
      replicas: 2
      resources:
        requests:
          cpu: "6"
          memory: 16Gi
          gpu: "1"
        limits:
          cpu: "6"
          memory: 16Gi
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:1.0.1
          workingDir: /workspace/components/backends/sglang
          command:
            - /bin/sh
            - -c
          args:
            - |
              python3 -m dynamo.sglang \
                --model-path deepseek-ai/DeepSeek-R1-Distill-Llama-8B \
                --served-model-name deepseek-ai/DeepSeek-R1-Distill-Llama-8B \
                --page-size 16 \
                --tp 1 \
                --trust-remote-code \
                --skip-tokenizer-init
