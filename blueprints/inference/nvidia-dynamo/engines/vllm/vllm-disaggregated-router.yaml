#
# Example: vLLM Disaggregated Deployment with KV Router Enabled
#
# This example demonstrates how to enable the KV Router feature (v0.5.0+) in a
# disaggregated deployment with separate prefill and decode workers.
#
# KV Router Benefits:
# - Improved cache hit rates for workloads with shared prompt prefixes
# - Reduced latency by routing requests to workers with relevant KV cache
# - Better GPU utilization through intelligent request routing
#
# For more information, see:
# - Dynamo docs: docs/benchmarks/kv-router-ab-testing.md
# - Upgrade guide: infra/nvidia-dynamo/UPGRADE_TO_V0.6.0.md

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-disaggregated-router
  namespace: dynamo
spec:
  backendFramework: vllm
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - curl -s http://localhost:8000/health | jq -e '.status == "healthy"'
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 4Gi
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.8.1
          workingDir: /workspace/components/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            # Enable KV Router by setting --router-mode kv
            - python3 -m dynamo.frontend --http-port 8000 --router-mode kv
      envs:
        # Alternative: Set via environment variable
        - name: DYN_ROUTER_MODE
          value: kv
    VllmDecodeWorker:
      envFromSecret: hf-token-secret
      componentType: worker
      replicas: 2  # Multiple replicas to demonstrate KV Router benefits
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 30
        failureThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      resources:
        requests:
          cpu: "10"
          memory: 20Gi
          gpu: "1"
        limits:
          cpu: "10"
          memory: 20Gi
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            failureThreshold: 60
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.8.1
          workingDir: /workspace/components/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            # Enable prefix caching for better KV Router performance
            - python3 -m dynamo.vllm --model Qwen/Qwen3-0.6B --enable-prefix-caching 2>&1 | tee /tmp/vllm-decode.log
    VllmPrefillWorker:
      envFromSecret: hf-token-secret
      componentType: worker
      replicas: 1
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 30
        failureThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      resources:
        requests:
          cpu: "10"
          memory: 20Gi
          gpu: "1"
        limits:
          cpu: "10"
          memory: 20Gi
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            failureThreshold: 60
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.8.1
          workingDir: /workspace/components/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            # Enable prefix caching and mark as prefill worker
            - |
              python3 -m dynamo.vllm \
                --model Qwen/Qwen3-0.6B \
                --is-prefill-worker \
                --enable-prefix-caching 2>&1 | tee /tmp/vllm-prefill.log
