# DynamoGraphDeployment for Llama 3 70B using LeaderWorkerSet (LWS)
# This deploys a 70B model across 2 nodes using tensor parallelism (TP=16)
#
# Prerequisites:
#   - LeaderWorkerSet CRD installed (v0.7.0+)
#   - Volcano scheduler installed
#   - Dynamo operator must detect LWS availability (restart if needed)
#   - 2 nodes with 8 GPUs each (e.g., p5.48xlarge or p4d.24xlarge)
#
# Key Configuration:
#   - nvidia.com/enable-grove: "false" - Forces use of LWS instead of Grove
#   - numberOfNodes: 2 - Creates 1 leader + 1 worker pod
#   - Each pod requests 8 GPUs for TP=16 total
#
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: llama3-70b-lws
  namespace: default
  annotations:
    # CRITICAL: This annotation forces LWS instead of Grove
    nvidia.com/enable-grove: "false"
spec:
  dynamoNamespace: "default"
  
  # Shared PVC for model cache (optional but recommended)
  pvcs:
    - name: "hf-cache-pvc"
      create: true
      accessModes:
        - ReadWriteMany
      resources:
        storage: "500Gi"
      storageClassName: "efs-sc"  # Adjust for your storage class

  services:
    # Frontend service - single pod
    frontend:
      componentType: "frontend"
      replicas: 1
      image: "nvcr.io/nvidia/nemo:24.09.llm"
      command:
        - "python"
        - "-m"
        - "dynamo.frontend"
      env:
        - name: DYNAMO_BACKEND
          value: "llm"
      resources:
        limits:
          cpu: "4"
          memory: "16Gi"
        requests:
          cpu: "2"
          memory: "8Gi"

    # LLM Backend - multi-node with LWS
    llm:
      componentType: "backend"
      subComponentType: "llm"
      replicas: 1  # Number of multi-node groups (each group = 1 leader + workers)
      numberOfNodes: 2  # Total nodes per group (creates leader-worker set)
      
      image: "nvcr.io/nvidia/nemo:24.09.llm"
      command:
        - "/bin/sh"
        - "-c"
      args:
        - |
          python -m dynamo.vllm \
            --model meta-llama/Llama-3.1-70B-Instruct \
            --tensor-parallel-size 16 \
            --pipeline-parallel-size 1 \
            --max-model-len 8192 \
            --gpu-memory-utilization 0.9
      
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
        - name: HF_HOME
          value: "/mnt/hf-cache"
        - name: TRANSFORMERS_CACHE
          value: "/mnt/hf-cache/transformers"
        # NCCL optimization for multi-node
        - name: NCCL_DEBUG
          value: "INFO"
        - name: NCCL_IB_DISABLE
          value: "0"
        - name: NCCL_P2P_DISABLE
          value: "0"
      
      resources:
        limits:
          nvidia.com/gpu: "8"
          memory: "400Gi"
          cpu: "48"
        requests:
          nvidia.com/gpu: "8"
          memory: "300Gi"
          cpu: "32"
      
      volumeMounts:
        - name: hf-cache-pvc
          mountPath: /mnt/hf-cache
      
      # Node selector for GPU nodes
      nodeSelector:
        node.kubernetes.io/instance-type: p5.48xlarge  # Adjust for your instance type
      
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"