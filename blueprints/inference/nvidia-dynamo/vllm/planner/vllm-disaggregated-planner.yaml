#
# Example: vLLM Disaggregated Deployment with SLA Planner
#
# This example demonstrates how to deploy the SLA Planner (v0.5.0+) for automated
# resource allocation based on SLA requirements. SLA Planner is a WORKLOAD-LEVEL
# feature deployed as a separate component in the DynamoGraphDeployment spec.
#
# SLA Planner Features:
# - Automated parallelization mapping and performance prediction
# - SLA-driven scaling of prefill/decode workers
# - Load forecasting with ARIMA, Prophet, or constant predictors
# - Performance interpolation based on profiling data
#
# Prerequisites:
# - Pre-deployment profiling must be completed (see docs/benchmarks/pre_deployment_profiling.md)
# - PVC with profiling results must exist (dynamo-pvc)
#
# For more information, see:
# - Dynamo docs: docs/planner/sla_planner.md
# - Upgrade guide: infra/nvidia-dynamo/UPGRADE_TO_V0.6.0.md

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamo-pvc
  namespace: dynamo-cloud
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc-dynamic
  resources:
    requests:
      storage: 100Gi
---
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-disaggregated-planner
  namespace: dynamo-cloud
spec:
  pvcs:
    - name: dynamo-pvc
      create: false  # PVC must be pre-created and profiling results must exist
  services:
    Frontend:
      dynamoNamespace: vllm-disaggregated-planner
      componentType: frontend
      replicas: 1
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - 'curl -s http://localhost:8000/health | jq -e ".status == \"healthy\""'
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.6.1
          workingDir: /workspace/components/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            - "python3 -m dynamo.frontend --http-port 8000"
    Planner:
      dynamoNamespace: vllm-disaggregated-planner
      componentType: planner
      replicas: 1
      volumeMounts:
        - name: dynamo-pvc
          mountPoint: /data
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.6.1
          workingDir: /workspace/components/src/dynamo/planner
          command:
            - /bin/sh
            - -c
          args:
            # SLA Planner configuration
            - |
              python3 -m planner_sla \
                --environment=kubernetes \
                --backend=vllm \
                --adjustment-interval=60 \
                --profile-results-dir=/data/profiling_results \
                2>&1 | tee /tmp/planner.log
    VllmDecodeWorker:
      dynamoNamespace: vllm-disaggregated-planner
      envFromSecret: hf-token-secret
      componentType: worker
      subComponentType: decode
      replicas: 1  # SLA Planner will adjust this dynamically
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 30
        failureThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      resources:
        requests:
          cpu: "10"
          memory: "20Gi"
          gpu: "1"
        limits:
          cpu: "10"
          memory: "20Gi"
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-gpu-karpenter
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            failureThreshold: 60
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.6.1
          workingDir: /workspace/components/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            - "python3 -m dynamo.vllm --model Qwen/Qwen3-0.6B 2>&1 | tee /tmp/vllm-decode.log"
    VllmPrefillWorker:
      dynamoNamespace: vllm-disaggregated-planner
      envFromSecret: hf-token-secret
      componentType: worker
      subComponentType: prefill
      replicas: 1  # SLA Planner will adjust this dynamically
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 30
        failureThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      resources:
        requests:
          cpu: "10"
          memory: "20Gi"
          gpu: "1"
        limits:
          cpu: "10"
          memory: "20Gi"
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-gpu-karpenter
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            failureThreshold: 60
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.6.1
          workingDir: /workspace/components/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            - "python3 -m dynamo.vllm --model Qwen/Qwen3-0.6B --is-prefill-worker 2>&1 | tee /tmp/vllm-prefill.log"

