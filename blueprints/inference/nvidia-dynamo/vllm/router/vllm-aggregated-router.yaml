#
# Example: vLLM Aggregated Deployment with KV Router Enabled
#
# This example demonstrates how to enable the KV Router feature (v0.5.0+) for
# cache-aware routing. KV Router is a WORKLOAD-LEVEL feature configured in the
# DynamoGraphDeployment spec, not a platform-level toggle.
#
# KV Router Benefits:
# - Improved cache hit rates for workloads with shared prompt prefixes
# - Reduced latency by routing requests to workers with relevant KV cache
# - Better GPU utilization through intelligent request routing
#
# For more information, see:
# - Dynamo docs: docs/benchmarks/kv-router-ab-testing.md
# - Upgrade guide: infra/nvidia-dynamo/UPGRADE_TO_V0.6.0.md

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-aggregated-kv-router
  namespace: dynamo-cloud
spec:
  backendFramework: vllm
  services:
    Frontend:
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - 'curl -s http://localhost:8000/health | jq -e ".status == \"healthy\""'
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      dynamoNamespace: vllm-aggregated-kv-router
      componentType: frontend
      replicas: 1
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.7.0.post1
          workingDir: /workspace/components/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            # Enable KV Router by setting DYN_ROUTER_MODE=kv
            - "python3 -m dynamo.frontend --http-port 8000 --router-mode kv"
          env:
            # Alternative: Set via environment variable
            - name: DYN_ROUTER_MODE
              value: "kv"
    VllmWorker:
      envFromSecret: hf-token-secret
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 30
        failureThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      dynamoNamespace: vllm-aggregated-kv-router
      componentType: worker
      replicas: 3  # Multiple replicas to demonstrate KV Router benefits
      resources:
        requests:
          cpu: "10"
          memory: "20Gi"
          gpu: "1"
        limits:
          cpu: "10"
          memory: "20Gi"
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 60
            failureThreshold: 300
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.7.0.post1
          workingDir: /workspace/components/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            # Enable prefix caching for better KV Router performance
            # Reduced max-model-len to 29000 to fit within A10G GPU memory (24GB)
            - "python3 -m dynamo.vllm --model Qwen/Qwen3-8B --enable-prefix-caching --max-model-len 29000 2>&1 | tee /tmp/vllm.log"

