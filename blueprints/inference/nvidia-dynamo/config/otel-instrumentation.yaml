  # TRT-LLM-specific OTEL configuration
  OTEL_SERVICE_NAME: "dynamo-trtllm"

  # TRT-LLM trace configuration
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.dynamo.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "grpc"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.1"
  OTEL_PROPAGATORS: "tracecontext,baggage"

  # TRT-LLM resource attributes
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=nvidia-dynamo,service.name=trtllm-worker,deployment.environment=production,runtime.name=tensorrt-llm"

  # TRT-LLM Python instrumentation
  OTEL_PYTHON_LOG_CORRELATION: "true"
  OTEL_PYTHON_EXCLUDED_URLS: "/health,/live,/ready,/metrics"

