# =============================================================================
# NVIDIA Dynamo - OpenTelemetry Instrumentation Configuration
# =============================================================================
#
# This file provides ConfigMaps with OTEL environment variables for Dynamo
# components. Each runtime (vLLM, SGLang, TRT-LLM) can use these configs to
# enable distributed tracing and metrics export.
#
# Usage:
#   kubectl apply -f config/otel-instrumentation.yaml -n dynamo
#
# Reference in blueprints:
#   spec:
#     services:
#       Worker:
#         extraPodSpec:
#           envFrom:
#             - configMapRef:
#                 name: dynamo-otel-common
#
# =============================================================================

---
# Common OTEL configuration for all Dynamo components
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamo-otel-common
  namespace: dynamo
  labels:
    app.kubernetes.io/name: dynamo-otel-config
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: nvidia-dynamo
  annotations:
    description: "Common OpenTelemetry configuration for all Dynamo runtimes"
data:
  # ==========================================================================
  # OTEL Core Configuration
  # ==========================================================================
  # Service name - should be overridden per deployment via pod metadata
  OTEL_SERVICE_NAME: "nvidia-dynamo"

  # SDK enabled/disabled (set to "true" to enable)
  OTEL_SDK_DISABLED: "false"

  # Propagators for distributed tracing context
  # W3C trace context is standard, B3 for compatibility with Zipkin
  OTEL_PROPAGATORS: "tracecontext,baggage,b3"

  # ==========================================================================
  # Trace Exporter Configuration
  # ==========================================================================
  # CRITICAL: Use OTEL_EXPORTER_OTLP_TRACES_ENDPOINT (not OTEL_EXPORT_ENDPOINT)
  # This is the correct environment variable per OTEL specification
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.dynamo.svc.cluster.local:4317"

  # Protocol for trace export (grpc recommended for performance)
  OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "grpc"

  # Compression for trace export
  OTEL_EXPORTER_OTLP_TRACES_COMPRESSION: "gzip"

  # Timeout for export operations (in milliseconds)
  OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: "30000"

  # ==========================================================================
  # Metrics Exporter Configuration
  # ==========================================================================
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://otel-collector.dynamo.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: "grpc"
  OTEL_EXPORTER_OTLP_METRICS_COMPRESSION: "gzip"

  # Metrics export interval (in milliseconds)
  OTEL_METRIC_EXPORT_INTERVAL: "15000"

  # ==========================================================================
  # Sampling Configuration
  # ==========================================================================
  # Sampling strategy: always_on, always_off, traceidratio, parentbased_*
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"

  # Sample ratio (0.0 to 1.0) - 0.1 = 10% of traces
  # Adjust based on traffic volume:
  # - Development: 1.0 (100%)
  # - Staging: 0.5 (50%)
  # - Production high-traffic: 0.01-0.1 (1-10%)
  OTEL_TRACES_SAMPLER_ARG: "0.1"

  # ==========================================================================
  # Resource Attributes
  # ==========================================================================
  # Standard resource attributes for Dynamo deployments
  # Additional attributes are added via k8sattributes processor
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=nvidia-dynamo,deployment.environment=production"

  # ==========================================================================
  # Logging Integration
  # ==========================================================================
  # Enable OTEL logging export (optional)
  OTEL_LOGS_EXPORTER: "none"

  # Log level for OTEL SDK itself
  OTEL_LOG_LEVEL: "info"

  # ==========================================================================
  # Python-specific OTEL Configuration
  # ==========================================================================
  # Auto-instrumentation for Python (vLLM, SGLang)
  OTEL_PYTHON_LOG_CORRELATION: "true"
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "false"

  # Excluded URLs from tracing (health checks)
  OTEL_PYTHON_EXCLUDED_URLS: "/health,/live,/ready,/metrics"

  # ==========================================================================
  # Batch Span Processor Configuration
  # ==========================================================================
  # Maximum queue size for pending spans
  OTEL_BSP_MAX_QUEUE_SIZE: "2048"

  # Maximum export batch size
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE: "512"

  # Delay between batch exports (in milliseconds)
  OTEL_BSP_SCHEDULE_DELAY: "5000"

  # ==========================================================================
  # Dynamo-specific Tracing Configuration
  # ==========================================================================
  # Enable Dynamo internal tracing
  DYN_TRACING_ENABLED: "true"

  # Trace span naming includes model name
  DYN_TRACING_INCLUDE_MODEL: "true"

  # Include request/response metadata in spans (may increase trace size)
  DYN_TRACING_INCLUDE_METADATA: "false"

---
# vLLM-specific OTEL configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamo-otel-vllm
  namespace: dynamo
  labels:
    app.kubernetes.io/name: dynamo-otel-config
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: nvidia-dynamo
    dynamo.nvidia.com/backend: vllm
  annotations:
    description: "OpenTelemetry configuration optimized for vLLM runtime"
data:
  # Inherit from common config, add vLLM-specific settings
  OTEL_SERVICE_NAME: "dynamo-vllm"

  # vLLM-specific trace configuration
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.dynamo.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "grpc"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.1"
  OTEL_PROPAGATORS: "tracecontext,baggage"

  # vLLM resource attributes
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=nvidia-dynamo,service.name=vllm-worker,deployment.environment=production,runtime.name=vllm"

  # vLLM Python instrumentation
  OTEL_PYTHON_LOG_CORRELATION: "true"
  OTEL_PYTHON_EXCLUDED_URLS: "/health,/live,/ready,/metrics"

  # vLLM metrics configuration
  DYN_VLLM_METRICS_ENABLED: "true"
  DYN_VLLM_METRICS_PORT: "8081"

  # vLLM tracing spans to capture
  DYN_VLLM_TRACE_PREFILL: "true"
  DYN_VLLM_TRACE_DECODE: "true"
  DYN_VLLM_TRACE_SCHEDULER: "false"

---
# SGLang-specific OTEL configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamo-otel-sglang
  namespace: dynamo
  labels:
    app.kubernetes.io/name: dynamo-otel-config
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: nvidia-dynamo
    dynamo.nvidia.com/backend: sglang
  annotations:
    description: "OpenTelemetry configuration optimized for SGLang runtime"
data:
  # SGLang-specific OTEL configuration
  OTEL_SERVICE_NAME: "dynamo-sglang"

  # SGLang trace configuration
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.dynamo.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "grpc"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.1"
  OTEL_PROPAGATORS: "tracecontext,baggage"

  # SGLang resource attributes
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=nvidia-dynamo,service.name=sglang-worker,deployment.environment=production,runtime.name=sglang"

  # SGLang Python instrumentation
  OTEL_PYTHON_LOG_CORRELATION: "true"
  OTEL_PYTHON_EXCLUDED_URLS: "/health,/live,/ready,/metrics"

  # SGLang metrics configuration
  DYN_SGLANG_METRICS_ENABLED: "true"
  DYN_SGLANG_METRICS_PORT: "8081"

  # SGLang-specific tracing for RadixAttention
  DYN_SGLANG_TRACE_RADIX: "true"
  DYN_SGLANG_TRACE_CACHE_HIT: "true"
  DYN_SGLANG_TRACE_PREFILL: "true"
  DYN_SGLANG_TRACE_DECODE: "true"

---
