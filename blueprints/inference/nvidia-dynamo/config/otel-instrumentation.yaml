  DYN_TRTLLM_TRACE_INFERENCE: "true"
  DYN_TRTLLM_TRACE_ENGINE: "false"

---
# Frontend-specific OTEL configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamo-otel-frontend
  namespace: dynamo
  labels:
    app.kubernetes.io/name: dynamo-otel-config
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: nvidia-dynamo
  annotations:
    description: "OpenTelemetry configuration for Dynamo frontend/router components"
data:
  # Frontend OTEL configuration
  OTEL_SERVICE_NAME: "dynamo-frontend"

  # Frontend trace configuration (higher sampling for request tracing)
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.dynamo.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "grpc"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  # Higher sampling rate for frontends to capture request flow
  OTEL_TRACES_SAMPLER_ARG: "0.25"
  OTEL_PROPAGATORS: "tracecontext,baggage"

  # Frontend resource attributes
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=nvidia-dynamo,service.name=frontend,deployment.environment=production,runtime.name=frontend"

  # Frontend Python instrumentation
  OTEL_PYTHON_LOG_CORRELATION: "true"
  # Don't exclude health checks from frontend (useful for debugging)
  OTEL_PYTHON_EXCLUDED_URLS: ""

  # Frontend metrics
  DYN_FRONTEND_METRICS_ENABLED: "true"
  DYN_FRONTEND_METRICS_PORT: "8000"

  # Frontend tracing - capture routing decisions
  DYN_FRONTEND_TRACE_ROUTING: "true"
  DYN_FRONTEND_TRACE_PREPROCESSING: "true"
  DYN_FRONTEND_TRACE_STREAMING: "true"

---
# Development environment OTEL configuration (100% sampling)
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamo-otel-development
  namespace: dynamo
  labels:
    app.kubernetes.io/name: dynamo-otel-config
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: nvidia-dynamo
  annotations:
    description: "OpenTelemetry configuration for development/debugging (100% sampling)"
data:
  # Development OTEL configuration - full tracing
  OTEL_SERVICE_NAME: "dynamo-dev"

  # Development trace configuration
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.dynamo.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "grpc"

  # 100% sampling for development
  OTEL_TRACES_SAMPLER: "always_on"
  OTEL_TRACES_SAMPLER_ARG: "1.0"
  OTEL_PROPAGATORS: "tracecontext,baggage,b3"

  # Development resource attributes
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=nvidia-dynamo,deployment.environment=development"

  # Full Python instrumentation for debugging
  OTEL_PYTHON_LOG_CORRELATION: "true"
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
  OTEL_PYTHON_EXCLUDED_URLS: ""

  # Verbose logging
  OTEL_LOG_LEVEL: "debug"

  # Smaller batch sizes for faster export in development
  OTEL_BSP_MAX_QUEUE_SIZE: "512"
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE: "128"
  OTEL_BSP_SCHEDULE_DELAY: "1000"

  # Enable all tracing features
  DYN_TRACING_ENABLED: "true"
  DYN_TRACING_INCLUDE_MODEL: "true"
  DYN_TRACING_INCLUDE_METADATA: "true"

---
# High-performance production OTEL configuration (low overhead)
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamo-otel-production
  namespace: dynamo
  labels:
    app.kubernetes.io/name: dynamo-otel-config
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: nvidia-dynamo
  annotations:
    description: "OpenTelemetry configuration for production (low sampling, optimized)"
data:
  # Production OTEL configuration - minimal overhead
  OTEL_SERVICE_NAME: "dynamo-production"

  # Production trace configuration
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "http://otel-collector.dynamo.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: "grpc"
  OTEL_EXPORTER_OTLP_TRACES_COMPRESSION: "gzip"

  # Low sampling for production (1% of traces)
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.01"
  OTEL_PROPAGATORS: "tracecontext"

  # Production resource attributes
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=nvidia-dynamo,deployment.environment=production"

  # Minimal Python instrumentation
  OTEL_PYTHON_LOG_CORRELATION: "false"
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "false"
  OTEL_PYTHON_EXCLUDED_URLS: "/health,/live,/ready,/metrics"

  # Production logging level
  OTEL_LOG_LEVEL: "warn"

  # Large batch sizes for efficiency
  OTEL_BSP_MAX_QUEUE_SIZE: "4096"
  OTEL_BSP_MAX_EXPORT_BATCH_SIZE: "1024"
  OTEL_BSP_SCHEDULE_DELAY: "10000"

  # Minimal tracing features
  DYN_TRACING_ENABLED: "true"
  DYN_TRACING_INCLUDE_MODEL: "false"
  DYN_TRACING_INCLUDE_METADATA: "false"
