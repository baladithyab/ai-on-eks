#
# PodMonitor template for NVIDIA Dynamo deployments
# This enables automatic metrics collection from Dynamo pods via Prometheus Operator
#
# The Dynamo Operator automatically labels pods with:
#   nvidia.com/metrics-enabled: "true" - Enables metrics collection
#   nvidia.com/dynamo-component-type: "frontend|worker" - Identifies component type
#
# Metrics Endpoints:
#   - Frontend (HTTP port 8000): dynamo_frontend_* metrics (request rates, latency, tokens)
#   - Worker (System port 8081): dynamo_component_* metrics (request processing, KV router stats)
#   - KVBM (Port 6880): KV cache backend metrics for disaggregated serving
#
# Reference: https://docs.nvidia.com/dynamo/observability/metrics.html
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: dynamo-inference-metrics
  namespace: nvidia-dynamo
  labels:
    # Required label for Prometheus Operator to discover this PodMonitor
    release: kube-prometheus-stack
    app.kubernetes.io/name: dynamo-podmonitor
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: nvidia-dynamo
spec:
  # Selector matches pods with Dynamo Operator's automatic metrics label
  # The operator adds this label to all pods that have metrics enabled
  selector:
    matchLabels:
      nvidia.com/metrics-enabled: "true"

  # Define endpoints for each metrics port exposed by Dynamo components
  podMetricsEndpoints:
    # Frontend metrics endpoint (HTTP API port)
    # Exposes: dynamo_frontend_* metrics
    # - dynamo_frontend_requests_total: Total LLM requests
    # - dynamo_frontend_time_to_first_token_seconds: TTFT latency
    # - dynamo_frontend_inter_token_latency_seconds: ITL latency
    # - dynamo_frontend_request_duration_seconds: Total request duration
    # - dynamo_frontend_input_sequence_tokens: Input token counts
    # - dynamo_frontend_output_sequence_tokens: Output token counts
    # - dynamo_frontend_inflight_requests: Current inflight requests
    # - dynamo_frontend_queued_requests: Requests in HTTP queue
    - port: metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      # Relabel configs to add useful Dynamo-specific labels
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_nvidia_com_dynamo_namespace]
          targetLabel: dynamo_namespace
        - sourceLabels: [__meta_kubernetes_pod_label_nvidia_com_dynamo_component]
          targetLabel: dynamo_component
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: kubernetes_namespace
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: kubernetes_pod

    # Worker system metrics endpoint (DYN_SYSTEM_PORT)
    # Exposes: dynamo_component_* metrics
    # - dynamo_component_requests_total: Total requests processed
    # - dynamo_component_request_duration_seconds: Processing time histogram
    # - dynamo_component_inflight_requests: Current inflight requests
    # - dynamo_component_request_bytes_total: Bytes received
    # - dynamo_component_response_bytes_total: Bytes sent
    # - dynamo_component_kvstats_*: KV router statistics (active blocks, cache usage)
    # Also includes backend-specific metrics: vllm:*, sglang:*, trtllm:*
    - port: worker-metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_nvidia_com_dynamo_namespace]
          targetLabel: dynamo_namespace
        - sourceLabels: [__meta_kubernetes_pod_label_nvidia_com_dynamo_component]
          targetLabel: dynamo_component
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: kubernetes_namespace
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: kubernetes_pod

    # KVBM metrics endpoint (KV cache backend manager)
    # Exposes: kvbm_* metrics for disaggregated serving with multi-tier caching
    # - kvbm_device_pool_*: GPU-resident KV block pool metrics
    # - kvbm_host_pool_*: CPU pinned-memory KV block pool metrics
    # - kvbm_disk_pool_*: NVMe-backed KV block pool metrics
    # - kvbm_transfer_*: Async transfer metrics (D2H, H2D, H2Disk, Disk2D)
    - port: kvbm-metrics
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_nvidia_com_dynamo_namespace]
          targetLabel: dynamo_namespace
        - sourceLabels: [__meta_kubernetes_pod_label_nvidia_com_dynamo_component]
          targetLabel: dynamo_component
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: kubernetes_namespace
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: kubernetes_pod

  # Namespace selector - monitor pods in all namespaces or restrict to specific ones
  # Option 1: Monitor all namespaces (uncomment for cluster-wide monitoring)
  # namespaceSelector:
  #   any: true

  # Option 2: Monitor specific namespaces (recommended for production)
  namespaceSelector:
    matchNames:
      - dynamo
      - nvidia-dynamo
      - dynamo-system
