#
# DeepSeek V3.2-Exp — Multi-Node + Disaggregated (TCP baseline)
#
# Combines two patterns:
#   1. Disaggregation — separate Prefill and Decode worker services
#   2. Multinode TP on the decode role — TP=16 split across 2 p5e.48xlarge
#
# This is the NON-EFA (VPC TCP) sibling of deepseek-v3.2-multinode-disagg-efa.yaml.
# Use it to produce the apples-to-apples benchmark baseline: NCCL all-reduce
# and NIXL KV cache transfer both go through VPC TCP at ~25 Gbps. Same model,
# same TP sizes, same hardware size — only the image tag, EFA device request,
# and FI/NCCL environment variables differ.
#
# DeepSeek V3.2-Exp architecture:
#   - 671B total parameters, ~37B active (MoE)
#   - Uses MLA + DeepSeek Sparse Attention (DSA) — REQUIRES Hopper/Blackwell.
#     Will not work on Ada (RTX PRO 6000) or earlier.
#   - Block-FP8 weights (~340 GB on disk)
#   - 163 safetensor shards — prefetching is mandatory to avoid HF 429 loops
#
# Layout:
#   Frontend:        1× dynamo-frontend pod (CPU only)
#   PrefillWorker:   2× p5.48xlarge (8× H100 80 GB each), TP=16, MULTINODE
#   DecodeWorker:    2× p5.48xlarge (8× H100 80 GB each), TP=16, MULTINODE
#   Total: 4 p5.48xlarge = 32 H100s, 2560 GB VRAM
#
# Why TP=16 (multinode) for both roles:
#   DeepSeek V3.2-Exp in block-FP8 is 342 GB. With TP=8 on a single
#   p5.48xlarge (8× H100 80 GB = 640 GB), per-GPU weight footprint is
#   ~43 GB, but activations + cache_transceiver buffers push past the
#   80 GB H100 budget during model load. TP=16 across 2 nodes drops
#   per-GPU weight to ~21 GB, leaving 50+ GB for everything else.
#   On p5e/p5en (H200 141 GB) TP=8 single-node would fit; adjust
#   accordingly if you have H200 capacity.
#
# Prerequisites:
#   - Karpenter NodePool: p5-nvidia (H100 + EFA)
#   - PVC: dynamo-model-cache (MUST prefetch first:
#          ./scripts/prefetch-model.sh deepseek-ai/DeepSeek-V3.2-Exp)
#   - Secret: hf-token-secret
#   - Grove + KAI Scheduler installed (default in our infra via adopt mode)

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: ds-v32-disagg
  namespace: dynamo-system
spec:
  pvcs:
    - name: dynamo-model-cache
      create: false
  services:
    Frontend:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: frontend
      replicas: 1
      resources:
        requests:
          cpu: "4"
          memory: "8Gi"
        limits:
          cpu: "4"
          memory: "8Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.0.1
          command:
            - /bin/sh
            - -c
          args:
            - "python3 -m dynamo.frontend --http-port 8000"

    PrefillWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
        # Matches upstream engines/vllm/vllm-disaggregated.yaml convention.
        # Live-tested: UCX_TLS=^mm does NOT fix the v1.0.1 MLA-disagg decode
        # crash (see README), but included for UCX transport hygiene.
        - name: UCX_TLS
          value: "^mm"
      componentType: worker
      subComponentType: prefill
      replicas: 1
      # Multi-node TP=16 for prefill — 2× p5.48xlarge gang-scheduled by Grove.
      # 342GB FP8 weights ÷ 16 GPUs = ~21 GB/GPU, fits 80 GB H100 with headroom.
      multinode:
        nodeCount: 2
      resources:
        requests:
          cpu: "96"
          memory: "800Gi"
          gpu: "8"
        limits:
          cpu: "96"
          memory: "800Gi"
          gpu: "8"
      sharedMemory:
        size: 128Gi
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: p5-nvidia
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          command:
            - /bin/sh
            - -c
          args:
            - |
              python3 -m dynamo.vllm \
                --model deepseek-ai/DeepSeek-V3.2-Exp \
                --tensor-parallel-size 16 \
                --enable-expert-parallel \
                --kv-cache-dtype fp8 \
                --max-model-len 8192 \
                --trust-remote-code \
                --gpu-memory-utilization 0.82 \
                --max-num-seqs 128 \
                --disaggregation-mode prefill \
                --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"

    DecodeWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
        # See PrefillWorker UCX_TLS note above.
        - name: UCX_TLS
          value: "^mm"
      componentType: worker
      subComponentType: decode
      replicas: 1
      # Multi-node TP=16 for decode — 2× p5.48xlarge gang-scheduled by Grove.
      multinode:
        nodeCount: 2
      resources:
        requests:
          cpu: "96"
          memory: "800Gi"
          gpu: "8"
        limits:
          cpu: "96"
          memory: "800Gi"
          gpu: "8"
      sharedMemory:
        size: 128Gi
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: p5-nvidia
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          command:
            - /bin/sh
            - -c
          args:
            - |
              python3 -m dynamo.vllm \
                --model deepseek-ai/DeepSeek-V3.2-Exp \
                --tensor-parallel-size 16 \
                --enable-expert-parallel \
                --kv-cache-dtype fp8 \
                --max-model-len 8192 \
                --trust-remote-code \
                --gpu-memory-utilization 0.82 \
                --max-num-seqs 128 \
                --disaggregation-mode decode \
                --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"
