---
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-multinode-lws
  namespace: dynamo
  annotations:
    # Force usage of LeaderWorkerSet (LWS) instead of Grove
    nvidia.com/enable-grove: "false"
spec:
  backendFramework: vllm
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - 'curl -s http://localhost:8000/health | jq -e ".status == \"healthy\""'
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.8.1
          command:
            - /bin/sh
            - -c
          args:
            - "python3 -m dynamo.frontend --http-port 8000"
    VllmWorker:
      componentType: worker
      replicas: 1
      multinode:
        nodeCount: 2
      resources:
        requests:
          cpu: "4"
          memory: "16Gi"
          gpu: "1"
        limits:
          cpu: "4"
          memory: "16Gi"
          gpu: "1"
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 15
        timeoutSeconds: 30
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      extraPodSpec:
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            failureThreshold: 60
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.8.1
          command:
            - /bin/sh
            - -c
          args:
            # TP=2 matches (2 nodes * 1 GPU/node)
            - "python3 -m dynamo.vllm --model Qwen/Qwen2.5-0.5B-Instruct \
               --tensor-parallel-size 2 2>&1 | tee /tmp/vllm.log"
