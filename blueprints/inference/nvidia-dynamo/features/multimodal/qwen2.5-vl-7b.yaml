#
# Qwen2.5-VL 7B Multimodal Deployment — Aggregated (Single VllmWorker)
#
# This uses the AGGREGATED pattern (single VllmWorker via dynamo.vllm) instead
# of the disaggregated E/P/D multimodal pattern (EncodeWorker + VLMWorker + Processor).
# The aggregated pattern avoids the "missing field 'id'" bug that affects the
# disaggregated multimodal architecture in Dynamo 0.8.1.
#
# Architecture:
# - Frontend: HTTP endpoint (OpenAI-compatible /v1/chat/completions)
# - VllmWorker: Single aggregated worker handling all multimodal processing
#
# Key Features:
# - Qwen2.5-VL-7B-Instruct vision-language model
# - Single GPU deployment (A10G 24GB)
# - --trust-remote-code for Qwen2.5-VL custom model code
# - Multimodal image + video support via vLLM's built-in vision pipeline
# - 4096 context window (optimized for multimodal)
#
# Requirements:
# - 1 GPU (g5.2xlarge+ with A10G)
# - HuggingFace token secret (hf-token-secret) for model download
#
# Why aggregated instead of disaggregated multimodal?
# - The E/P/D pattern (EncodeWorker + VLMWorker + Processor) triggers
#   "missing field 'id'" validation error in Dynamo 0.8.1 frontend
# - Aggregated vLLM natively supports multimodal via --limit-mm-per-prompt
# - Simpler deployment, fewer resources, easier to debug

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: qwen25-vl-7b
  namespace: dynamo-system
spec:
  backendFramework: vllm
  pvcs:
  - name: dynamo-model-cache
    create: false
  services:
    Frontend:
      envFromSecret: hf-token-secret
      volumeMounts:
      - name: dynamo-model-cache
        mountPoint: /models
      envs:
      - name: HF_HOME
        value: /models
      - name: HF_HUB_CACHE
        value: /models
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      componentType: frontend
      replicas: 1
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "4"
          memory: 8Gi
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.0.1
          workingDir: /workspace/components/backends/vllm
          command:
          - /bin/sh
          - -c
          args:
          - python3 -m dynamo.frontend --http-port 8000
    VllmWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
      - name: dynamo-model-cache
        mountPoint: /models
      envs:
      - name: HF_HOME
        value: /models
      - name: HF_HUB_CACHE
        value: /models
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 30
        failureThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      componentType: worker
      replicas: 1
      resources:
        requests:
          cpu: "4"
          memory: 24Gi
          gpu: "1"
        limits:
          cpu: "4"
          memory: 24Gi
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 60
            failureThreshold: 300
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          workingDir: /workspace/components/backends/vllm
          command:
          - /bin/sh
          - -c
          args:
          - >-
            python3 -m dynamo.vllm
            --model Qwen/Qwen2.5-VL-7B-Instruct
            --trust-remote-code
            --enable-multimodal
            --max-model-len 4096
            --gpu-memory-utilization 0.90
            --limit-mm-per-prompt '{"image": 4, "video": 2}'
            2>&1 | tee /tmp/vllm.log
        tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
