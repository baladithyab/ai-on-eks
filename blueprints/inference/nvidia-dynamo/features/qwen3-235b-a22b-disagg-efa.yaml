# Qwen3-235B-A22B-Instruct-2507-FP8 — Single-Node Disaggregated (EFA)
#
# EFA sibling of qwen3-235b-a22b-disagg.yaml. Identical in every way
# except:
#   - image tag: vllm-runtime:1.0.1-efa-amd64
#   - vpc.amazonaws.com/efa: "32" under resources.{requests,limits}.custom
#   - FI_PROVIDER=efa + NCCL tuning env vars
#
# See qwen3-235b-a22b-disagg.yaml for full architecture notes.

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: qwen3-235b-efa
  namespace: dynamo-system
spec:
  pvcs:
    - name: dynamo-model-cache
      create: false
  services:
    Frontend:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: frontend
      replicas: 1
      resources:
        requests:
          cpu: "4"
          memory: "8Gi"
        limits:
          cpu: "4"
          memory: "8Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.0.1
          command:
            - /bin/sh
            - -c
          args:
            - "python3 -m dynamo.frontend --http-port 8000"

    PrefillWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
        - name: FI_PROVIDER
          value: efa
        - name: FI_EFA_USE_DEVICE_RDMA
          value: "1"
        - name: NCCL_SOCKET_IFNAME
          value: "^lo,docker,veth"
        - name: NCCL_PROTO
          value: simple
        # UCX_TLS=^mm excludes shared-memory transport to avoid broadcast
        # deadlock. Live-tested: UCX on the -efa-amd64 image does NOT support
        # EFA (rdmacm fails with "Input/output error" at init — this image
        # builds UCX without libfabric, so NIXL's UCX-based KV transfer
        # silently falls back to UCX-over-TCP. Setting UCX_TLS=rc,cuda,self
        # to force RDMA fails with "Destination is unreachable" because no
        # cross-node UCX transport is available. ^mm is the working default.
        # NCCL separately uses EFA via aws-ofi-nccl + libfabric — that path
        # is healthy but irrelevant for single-node TP=8 (NCCL all-reduce
        # stays on NVLink).
        - name: UCX_TLS
          value: "^mm"
      componentType: worker
      subComponentType: prefill
      replicas: 1
      resources:
        requests:
          cpu: "96"
          memory: "800Gi"
          gpu: "8"
          custom:
            vpc.amazonaws.com/efa: "32"
        limits:
          cpu: "96"
          memory: "800Gi"
          gpu: "8"
          custom:
            vpc.amazonaws.com/efa: "32"
      sharedMemory:
        size: 128Gi
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: p5-nvidia
        # REQUIRED for EFA: co-locate prefill and decode workers in the same
        # Availability Zone. EFA RDMA is intra-AZ ONLY — cross-AZ placement
        # causes NIXL handshake failures (nixlBackendError: NIXL_ERR_BACKEND
        # at add_remote_agent). Live-tested: without this constraint, Karpenter
        # will freely place p5.48xlarge spot across AZs based on capacity,
        # which breaks disagg.
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: nvidia.com/dynamo-graph-deployment-name
                      operator: In
                      values: ["qwen3-235b-efa"]
                    - key: nvidia.com/dynamo-component-type
                      operator: In
                      values: ["worker"]
                topologyKey: topology.kubernetes.io/zone
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1-efa-amd64
          command:
            - /bin/sh
            - -c
          args:
            - |
              python3 -m dynamo.vllm \
                --model Qwen/Qwen3-235B-A22B-Instruct-2507-FP8 \
                --tensor-parallel-size 8 \
                --enable-expert-parallel \
                --max-model-len 8192 \
                --gpu-memory-utilization 0.85 \
                --max-num-seqs 128 \
                --trust-remote-code \
                --disaggregation-mode prefill \
                --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"

    DecodeWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
        - name: FI_PROVIDER
          value: efa
        - name: FI_EFA_USE_DEVICE_RDMA
          value: "1"
        - name: NCCL_SOCKET_IFNAME
          value: "^lo,docker,veth"
        - name: NCCL_PROTO
          value: simple
        # See PrefillWorker UCX_TLS note above.
        - name: UCX_TLS
          value: "^mm"
      componentType: worker
      subComponentType: decode
      replicas: 1
      resources:
        requests:
          cpu: "96"
          memory: "800Gi"
          gpu: "8"
          custom:
            vpc.amazonaws.com/efa: "32"
        limits:
          cpu: "96"
          memory: "800Gi"
          gpu: "8"
          custom:
            vpc.amazonaws.com/efa: "32"
      sharedMemory:
        size: 128Gi
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: p5-nvidia
        # See PrefillWorker note above — same-AZ co-location required for EFA.
        affinity:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: nvidia.com/dynamo-graph-deployment-name
                      operator: In
                      values: ["qwen3-235b-efa"]
                    - key: nvidia.com/dynamo-component-type
                      operator: In
                      values: ["worker"]
                topologyKey: topology.kubernetes.io/zone
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1-efa-amd64
          command:
            - /bin/sh
            - -c
          args:
            - |
              python3 -m dynamo.vllm \
                --model Qwen/Qwen3-235B-A22B-Instruct-2507-FP8 \
                --tensor-parallel-size 8 \
                --enable-expert-parallel \
                --max-model-len 8192 \
                --gpu-memory-utilization 0.85 \
                --max-num-seqs 128 \
                --trust-remote-code \
                --disaggregation-mode decode \
                --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"
