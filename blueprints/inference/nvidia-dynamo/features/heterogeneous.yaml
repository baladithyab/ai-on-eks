#
# Cost-Optimized Heterogeneous Disaggregated Inference
#
# L40S (g6e) for compute-intensive prefill, cheap A10G (g5) for
# memory-bandwidth-bound decode.
#
# GPU Assignment:
#   Prefill: g6e-nvidia (L40S, 48 GB VRAM)
#   Decode:  g5-nvidia  (A10G, 24 GB VRAM)
#
# Prerequisites:
#   - Karpenter NodePools: g5-nvidia, g6e-nvidia
#   - PVC: dynamo-model-cache
#   - Secret: hf-token-secret

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-hetero-cost
  namespace: dynamo-system
spec:
  backendFramework: vllm
  pvcs:
    - name: dynamo-model-cache
      create: false
  services:
    Frontend:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: frontend
      replicas: 1
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 4Gi
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.0.1
          command:
            - /bin/sh
            - -c
          args:
            - python3 -m dynamo.frontend --http-port 8000

    VllmDecodeWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: UCX_TLS
          value: ^mm
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: worker
      subComponentType: decode
      replicas: 1
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 30
        failureThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          gpu: "1"
        limits:
          cpu: "4"
          memory: 16Gi
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            failureThreshold: 60
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          command:
            - /bin/sh
            - -c
          args:
            - >-
              python3 -m dynamo.vllm
              --model deepseek-ai/DeepSeek-R1-Distill-Llama-8B
              --tensor-parallel-size 1
              --enforce-eager
              --max-model-len 4096
              2>&1 | tee /tmp/vllm-decode.log
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"

    VllmPrefillWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: UCX_TLS
          value: ^mm
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: worker
      subComponentType: prefill
      replicas: 1
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 30
        failureThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          gpu: "1"
        limits:
          cpu: "4"
          memory: 16Gi
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g6e-nvidia
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            failureThreshold: 60
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          command:
            - /bin/sh
            - -c
          args:
            - >-
              python3 -m dynamo.vllm
              --model deepseek-ai/DeepSeek-R1-Distill-Llama-8B
              --disaggregation-mode prefill
              --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
              --tensor-parallel-size 1
              --enforce-eager
              --max-model-len 8192
              2>&1 | tee /tmp/vllm-prefill.log
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"
