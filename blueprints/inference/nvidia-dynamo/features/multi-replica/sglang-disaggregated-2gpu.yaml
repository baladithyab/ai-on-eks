#
# SGLang Disaggregated Inference with 2 GPUs per worker (TP=2)
# Uses Mooncake TCP for KV cache transfer between prefill and decode workers
# (NIXL does not work on PCIe topologies — Fix 15b)
# Requires g5.12xlarge (4 GPUs) - 2 for prefill, 2 for decode

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: sglang-disaggregated-2gpu
  namespace: dynamo
spec:
  backendFramework: sglang
  pvcs:
  - name: dynamo-model-cache
    create: false
  services:
    Frontend:
      envFromSecret: hf-token-secret
      volumeMounts:
      - name: dynamo-model-cache
        mountPoint: /models
      envs:
      - name: HF_HOME
        value: /models
      - name: HF_HUB_CACHE
        value: /models
      componentType: frontend
      replicas: 1
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        exec:
          command:
          - /bin/sh
          - -c
          - exit 0
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 4Gi
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:0.8.1
          workingDir: /workspace/components/backends/sglang
          command: [sh, -c]
          args:
          - python3 -m dynamo.frontend --http-port=8000
    SGLangDecodeWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
      - name: dynamo-model-cache
        mountPoint: /models
      envs:
      - name: MC_FORCE_TCP
        value: "True"   # Force Mooncake to use TCP transport (no RDMA on PCIe)
      - name: HF_HOME
        value: /models
      - name: HF_HUB_CACHE
        value: /models
      componentType: worker
      subComponentType: decode
      replicas: 1
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 30
        failureThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      resources:
        requests:
          cpu: "8"
          memory: 40Gi
          gpu: "2"
        limits:
          cpu: "8"
          memory: 40Gi
          gpu: "2"
      sharedMemory:
        size: 12Gi
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia # or g7e-nvidia for L40S
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 60
            failureThreshold: 300
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:0.8.1
          workingDir: /workspace/components/backends/sglang
          command:
          - /bin/sh
          - -c
          args:
          - |
            python3 -m dynamo.sglang \
              --model-path deepseek-ai/DeepSeek-R1-Distill-Llama-8B \
              --served-model-name deepseek-ai/DeepSeek-R1-Distill-Llama-8B \
              --page-size 16 \
              --tp 2 \
              --trust-remote-code \
              --skip-tokenizer-init \
              --disaggregation-mode decode \
              --disaggregation-transfer-backend mooncake \
              --disaggregation-bootstrap-port 12345 \
              --host 0.0.0.0 \
              2>&1 | tee /tmp/sglang-decode.log
    SGLangPrefillWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
      - name: dynamo-model-cache
        mountPoint: /models
      envs:
      - name: MC_FORCE_TCP
        value: "True"   # Force Mooncake to use TCP transport (no RDMA on PCIe)
      - name: HF_HOME
        value: /models
      - name: HF_HUB_CACHE
        value: /models
      componentType: worker
      subComponentType: prefill
      replicas: 1
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 30
        failureThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      resources:
        requests:
          cpu: "8"
          memory: 40Gi
          gpu: "2"
        limits:
          cpu: "8"
          memory: 40Gi
          gpu: "2"
      sharedMemory:
        size: 12Gi
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia # or g7e-nvidia for L40S
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 60
            failureThreshold: 300
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:0.8.1
          workingDir: /workspace/components/backends/sglang
          command:
          - /bin/sh
          - -c
          args:
          - |
            python3 -m dynamo.sglang \
              --model-path deepseek-ai/DeepSeek-R1-Distill-Llama-8B \
              --served-model-name deepseek-ai/DeepSeek-R1-Distill-Llama-8B \
              --page-size 16 \
              --tp 2 \
              --trust-remote-code \
              --skip-tokenizer-init \
              --disaggregation-mode prefill \
              --disaggregation-transfer-backend mooncake \
              --disaggregation-bootstrap-port 12345 \
              --host 0.0.0.0 \
              2>&1 | tee /tmp/sglang-prefill.log
