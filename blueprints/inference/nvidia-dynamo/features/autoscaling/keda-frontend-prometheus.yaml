---
# Alternative ScaledObject using concurrent requests
# This is a simpler alternative that scales based on current load
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: dynamo-frontend-simple-scaledobject
  namespace: dynamo
  labels:
    app.kubernetes.io/name: dynamo-frontend-simple-scaledobject
    app.kubernetes.io/component: autoscaling
    app.kubernetes.io/part-of: nvidia-dynamo
  annotations:
    description: Simple KEDA ScaledObject based on concurrent requests
    dynamo.nvidia.com/scaling-type: keda-prometheus-simple
spec:
  scaleTargetRef:
    apiVersion: nvidia.com/v1alpha1
    kind: DynamoGraphDeploymentScalingAdapter
    name: vllm-aggregated-default-frontend

  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 30
  cooldownPeriod: 300

  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
        # Scale based on concurrent requests per pod
        query: |
          sum(dynamo_concurrent_requests{
            dynamo_namespace="vllm-aggregated-default"
          }) / count(up{
            job=~".*dynamo.*frontend.*"
          }) or vector(0)
        # Target 50 concurrent requests per Frontend pod
        threshold: "50"
      metricType: Value
