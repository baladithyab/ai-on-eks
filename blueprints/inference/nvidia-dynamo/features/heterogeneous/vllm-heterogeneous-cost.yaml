# ============================================================================
# Experiment 1: Cost-Optimized Heterogeneous Disaggregated Inference
# ============================================================================
#
# Rationale:
#   L40S (g6e) for compute-intensive prefill, cheap A10G (g5) for
#   memory-bandwidth-bound decode. This tests whether decode — which is
#   largely memory-bandwidth limited — can run effectively on a cheaper GPU
#   while keeping prefill on a more capable accelerator.
#
# GPU Assignment:
#   Prefill: g6e-nvidia (L40S, 48 GB VRAM) — 1 GPU, TP=1
#   Decode:  g5-nvidia  (A10G, 24 GB VRAM) — 1 GPU, TP=1
#
# VRAM Constraints:
#   - A10G (24 GB) limits decode max-model-len to 4096
#   - L40S (48 GB) allows prefill max-model-len of 8192
#
# KV Cache Transfer: TCP (default in Dynamo ≥ 0.8.0)
#
# Prerequisites:
#   - Karpenter NodePools: g5-nvidia, g6e-nvidia
#   - PVC: dynamo-model-cache (EFS-backed, ReadWriteMany)
#   - Secret: hf-token-secret (HuggingFace token)
#   - ImagePullSecret: nvcr-imagepullsecret (configured on namespace or SA)
# ============================================================================

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-hetero-cost
  namespace: dynamo
spec:
  backendFramework: vllm
  pvcs:
    - name: dynamo-model-cache
      create: false
  services:
    # ── Frontend ──────────────────────────────────────────────────────────
    # No GPU required — runs on any schedulable node.
    Frontend:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: frontend
      replicas: 1
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 4Gi
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:0.8.1
          workingDir: /workspace/components/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            - python3 -m dynamo.frontend --http-port 8000

    # ── Decode Worker — A10G (g5-nvidia) ─────────────────────────────────
    # A10G has 24 GB VRAM → max-model-len capped at 4096.
    # Decode is memory-bandwidth-bound, so cheaper A10G is cost-effective.
    VllmDecodeWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: UCX_TLS
          value: ^mm # Disable shared memory transport to avoid broadcast deadlock
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: worker
      subComponentType: decode
      replicas: 1
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 30
        failureThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          gpu: "1"
        limits:
          cpu: "4"
          memory: 16Gi
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            failureThreshold: 60
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.8.1
          workingDir: /workspace/components/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            - >-
              python3 -m dynamo.vllm
              --model deepseek-ai/DeepSeek-R1-Distill-Llama-8B
              --tensor-parallel-size 1
              --enforce-eager
              --max-model-len 4096
              2>&1 | tee /tmp/vllm-decode.log
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"

    # ── Prefill Worker — L40S (g6e-nvidia) ───────────────────────────────
    # L40S has 48 GB VRAM → max-model-len 8192 for richer prefill context.
    # L40S FP16 compute throughput benefits compute-intensive prefill.
    VllmPrefillWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: UCX_TLS
          value: ^mm # Disable shared memory transport to avoid broadcast deadlock
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: worker
      subComponentType: prefill
      replicas: 1
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 30
        failureThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          gpu: "1"
        limits:
          cpu: "4"
          memory: 16Gi
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g6e-nvidia
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 10
            failureThreshold: 60
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.8.1
          workingDir: /workspace/components/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            - >-
              python3 -m dynamo.vllm
              --model deepseek-ai/DeepSeek-R1-Distill-Llama-8B
              --is-prefill-worker
              --tensor-parallel-size 1
              --enforce-eager
              --max-model-len 8192
              2>&1 | tee /tmp/vllm-prefill.log
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"
