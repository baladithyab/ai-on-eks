#
# Multi-Replica vLLM with KV-Aware Routing
# 2 prefill workers + 2 decode workers with a KV-routing frontend.
# Demonstrates high-availability disaggregated inference.
#
# Prerequisites:
#   - PVC: dynamo-model-cache
#   - Secret: hf-token-secret
#   - Karpenter NodePool: g5-nvidia

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: multi-replica-vllm
  namespace: dynamo-system
spec:
  backendFramework: vllm
  pvcs:
  - name: dynamo-model-cache
    create: false
  services:
    Frontend:
      envFromSecret: hf-token-secret
      volumeMounts:
      - name: dynamo-model-cache
        mountPoint: /models
      envs:
      - name: DYN_ROUTER_MODE
        value: kv
      - name: HF_HOME
        value: /models
      - name: HF_HUB_CACHE
        value: /models
      componentType: frontend
      replicas: 1
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.0.1
          command:
          - /bin/sh
          - -c
          args:
          - python3 -m dynamo.frontend --http-port 8000 --router-mode kv
    PrefillWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
      - name: dynamo-model-cache
        mountPoint: /models
      envs:
      - name: HF_HOME
        value: /models
      - name: HF_HUB_CACHE
        value: /models
      componentType: worker
      replicas: 2
      resources:
        requests:
          cpu: "8"
          memory: 16Gi
          gpu: "1"
        limits:
          cpu: "8"
          memory: 16Gi
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          command:
          - /bin/sh
          - -c
          args:
          - python3 -m dynamo.vllm --model Qwen/Qwen3-0.6B --disaggregation-mode prefill --kv-transfer-config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
    DecodeWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
      - name: dynamo-model-cache
        mountPoint: /models
      envs:
      - name: HF_HOME
        value: /models
      - name: HF_HUB_CACHE
        value: /models
      componentType: worker
      replicas: 2
      resources:
        requests:
          cpu: "8"
          memory: 16Gi
          gpu: "1"
        limits:
          cpu: "8"
          memory: 16Gi
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          command:
          - /bin/sh
          - -c
          args:
          - python3 -m dynamo.vllm --model Qwen/Qwen3-0.6B
