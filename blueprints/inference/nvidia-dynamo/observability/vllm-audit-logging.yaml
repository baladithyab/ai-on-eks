#
# vLLM Disaggregated with Audit Logging
# Logs all chat completion requests in JSONL format for compliance and security auditing
# Audit logs include request/response details, timestamps, and user information

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-audit
  namespace: dynamo-cloud
spec:
  backendFramework: vllm
  # Common environment variables for all services
  envs:
    # Enable JSONL logging (required for audit logging)
    - name: DYN_LOGGING_JSONL
      value: "true"
    # Optional: Use local timezone for log timestamps (default: UTC)
    # - name: DYN_LOG_USE_LOCAL_TZ
    #   value: "1"

  services:
    Frontend:
      dynamoNamespace: vllm-audit
      componentType: frontend
      replicas: 1
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.7.0.post1
          workingDir: /workspace/components/backends/vllm
          command:
          - python3
          - -m
          - dynamo.frontend
          args:
            - --http-port
            - "8000"
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "16Gi"

    VllmDecodeWorker:
      dynamoNamespace: vllm-audit
      envFromSecret: hf-token-secret
      componentType: worker
      replicas: 1
      resources:
        requests:
          cpu: "8"
          memory: "32Gi"
        limits:
          gpu: "1"
          memory: "32Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.7.0.post1
          workingDir: /workspace/components/backends/vllm
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
            - --model
            - Qwen/Qwen3-0.6B
            - --gpu-memory-utilization
            - "0.9"
            - --disable-log-requests
            - --max-model-len
            - "8192"
            - --enforce-eager
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"

    VllmPrefillWorker:
      dynamoNamespace: vllm-audit
      envFromSecret: hf-token-secret
      componentType: worker
      replicas: 1
      resources:
        requests:
          cpu: "8"
          memory: "32Gi"
        limits:
          gpu: "1"
          memory: "32Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.7.0.post1
          workingDir: /workspace/components/backends/vllm
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
            - --model
            - Qwen/Qwen3-0.6B
            - --is-prefill-worker
            - --gpu-memory-utilization
            - "0.9"
            - --disable-log-requests
            - --max-model-len
            - "8192"
            - --enforce-eager
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"

