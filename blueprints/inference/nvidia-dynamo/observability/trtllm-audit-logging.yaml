#
# TensorRT-LLM Aggregated with Audit Logging
# Logs all chat completion requests in JSONL format for compliance and security auditing
# Uses aggregated architecture (single worker) for efficient resource usage
# Audit logs include request/response details, timestamps, and user information

# ConfigMap containing TensorRT-LLM engine configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: trtllm-audit-config
  namespace: dynamo
data:
  agg.yaml: |
    # Default TensorRT-LLM Engine Configuration
    tensor_parallel_size: 1
    moe_expert_parallel_size: 1
    enable_attention_dp: false
    max_num_tokens: 8192
    max_batch_size: 16
    trust_remote_code: true
    backend: pytorch
    enable_chunked_prefill: true

    kv_cache_config:
      free_gpu_memory_fraction: 0.85

    cuda_graph_config:
      max_batch_size: 16

# yamllint disable-line rule:document-start
---
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: trtllm-audit
  namespace: dynamo
spec:
  backendFramework: trtllm
  # Common environment variables for all services
  envs:
    # Enable JSONL logging (required for audit logging)
    - name: DYN_LOGGING_JSONL
      value: "true"
      # Optional: Use local timezone for log timestamps (default: UTC)
      # - name: DYN_LOG_USE_LOCAL_TZ
      #   value: "1"

  pvcs:
    - name: dynamo-model-cache
      create: false
  services:
    Frontend:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      componentType: frontend
      replicas: 1
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
        limits:
          cpu: "2"
          memory: 4Gi
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:0.8.1
          workingDir: /workspace/components/backends/trtllm
          command:
            - /bin/sh
            - -c
          args:
            - python3 -m dynamo.frontend --http-port 8000

    TRTLLMWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 60
      componentType: worker
      replicas: 1
      resources:
        requests:
          cpu: "8"
          memory: 20Gi
          gpu: "1"
        limits:
          cpu: "8"
          memory: 20Gi
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        # Mount ConfigMap as volume
        volumes:
          - name: trtllm-audit-config
            configMap:
              name: trtllm-audit-config
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 15
            failureThreshold: 120
          image: nvcr.io/nvidia/ai-dynamo/tensorrtllm-runtime:0.8.1
          workingDir: /workspace/components/backends/trtllm
          # Mount ConfigMap to engine_configs directory
          volumeMounts:
            - name: trtllm-audit-config
              mountPath: /workspace/components/backends/trtllm/engine_configs
              readOnly: true
          command:
            - /bin/sh
            - -c
          args:
            - |
              python3 -m dynamo.trtllm \
                --model-path Qwen/Qwen3-0.6B \
                --served-model-name Qwen/Qwen3-0.6B \
                --extra-engine-args engine_configs/agg.yaml
