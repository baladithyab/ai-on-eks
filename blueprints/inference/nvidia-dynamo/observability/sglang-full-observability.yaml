#
# SGLang Aggregated with Full Observability Stack
# Combines: OTEL distributed tracing + JSONL audit logging + Prometheus metrics
# Uses aggregated architecture (single worker) for efficient resource usage
#
# TEMPO DEPLOYMENT (Optional - required for trace collection):
# If Tempo is not deployed, traces will still be generated but export will fail
# with "BatchSpanProcessor.ExportError: tcp connect error" every 5 seconds.
# This does NOT affect inference functionality.
#
# To disable OTEL export (removes error logs when Tempo not available):
#   Set OTEL_EXPORT_ENABLED to "0" in the envs section below

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: sglang-full-obs
  namespace: dynamo
spec:
  backendFramework: sglang
  # Common environment variables for all services
  envs:
    # Enable JSONL logging (required for OTEL tracing and audit logging)
    - name: DYN_LOGGING_JSONL
      value: "true"
      # Enable OTEL trace export to Tempo
    - name: OTEL_EXPORT_ENABLED
      value: "1"
      # Tempo endpoint - defaults to tempo namespace; adjust if Tempo is elsewhere
    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: http://tempo.tempo.svc.cluster.local:4317

  pvcs:
    - name: dynamo-model-cache
      create: false
  services:
    Frontend:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - exit 0
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      componentType: frontend
      replicas: 1
      resources:
        requests:
          cpu: "5"
          memory: 10Gi
        limits:
          cpu: "5"
          memory: 10Gi
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:0.8.1
          workingDir: /workspace/components/backends/sglang
          command: [sh, -c]
          args:
            - python3 -m dynamo.frontend --http-port=8000
          env:
            # Service name for identifying frontend in traces
            - name: OTEL_SERVICE_NAME
              value: dynamo-frontend

    SGLangWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      livenessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - exit 0
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - exit 0
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      componentType: worker
      replicas: 1
      resources:
        requests:
          cpu: "10"
          memory: 20Gi
          gpu: "1"
        limits:
          cpu: "10"
          memory: 20Gi
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:0.8.1
          workingDir: /workspace/components/backends/sglang
          command:
            - /bin/sh
            - -c
          args:
            - |
              python3 -m dynamo.sglang \
                --model-path Qwen/Qwen3-0.6B \
                --served-model-name Qwen/Qwen3-0.6B \
                --page-size 16 \
                --tp 1 \
                --trust-remote-code \
                --skip-tokenizer-init
          env:
            # Service name for identifying worker in traces
            - name: OTEL_SERVICE_NAME
              value: dynamo-worker
