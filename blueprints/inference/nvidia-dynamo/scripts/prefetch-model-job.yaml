# Prefetch Model Job
#
# Downloads a HuggingFace model to the shared EFS PVC with proper retry-on-429
# semantics. Dynamo's fetch_model doesn't retry transient HF 429 errors, so
# models >100GB often hit the crash-restart loop.
#
# The huggingface_hub Python client has built-in exponential backoff retry
# for 429s, making it the reliable way to pre-warm the EFS cache.
#
# Usage:
#   1. Edit MODEL_ID below (default: MiniMaxAI/MiniMax-M2.7)
#   2. kubectl apply -f prefetch-model-job.yaml -n dynamo-system
#   3. kubectl logs -n dynamo-system job/prefetch-model -f
#   4. Once complete, deploy your DGD — it will find the model cached on EFS
#
# The job uses a lightweight Python image and runs with a dedicated backoff
# config: up to 15 retries, exponential up to 300s between attempts.

apiVersion: batch/v1
kind: Job
metadata:
  name: prefetch-model
  namespace: dynamo-system
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: prefetch
          image: python:3.12-slim
          env:
            - name: MODEL_ID
              value: "MiniMaxAI/MiniMax-M2.7"
            - name: HF_HOME
              value: /models
            - name: HF_HUB_CACHE
              value: /models
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: HF_TOKEN
                  optional: true
            # Max retries on transient errors (429, 503, network issues)
            - name: HF_HUB_DOWNLOAD_MAX_RETRIES
              value: "15"
            # Use single-threaded downloads — less aggressive on HF
            - name: HF_HUB_ETAG_TIMEOUT
              value: "60"
            - name: HF_HUB_DOWNLOAD_TIMEOUT
              value: "300"
            # Disable fast parallel downloads (more aggressive, more 429s)
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "0"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Installing huggingface_hub..."
              pip install --quiet huggingface_hub

              echo "Clearing any stale locks from prior attempts..."
              find /models -name '*.lock' -delete 2>/dev/null || true

              echo ""
              echo "Downloading ${MODEL_ID} to /models"
              echo "  Cache dir: ${HF_HUB_CACHE}"
              echo "  HF_TOKEN:  ${HF_TOKEN:+SET}${HF_TOKEN:-NOT SET (public models only)}"
              echo "  Retries:   ${HF_HUB_DOWNLOAD_MAX_RETRIES}"
              echo ""

              python3 <<'PYEOF'
              import os
              import sys
              import time
              from huggingface_hub import snapshot_download
              from huggingface_hub.utils import HfHubHTTPError

              model_id = os.environ["MODEL_ID"]
              cache_dir = os.environ["HF_HUB_CACHE"]
              token = os.environ.get("HF_TOKEN") or None

              max_attempts = 30
              backoff_base = 30  # seconds

              for attempt in range(1, max_attempts + 1):
                  try:
                      print(f"[Attempt {attempt}/{max_attempts}] snapshot_download({model_id})", flush=True)
                      path = snapshot_download(
                          repo_id=model_id,
                          cache_dir=cache_dir,
                          token=token,
                          resume_download=True,
                          max_workers=2,  # Serial-ish to avoid 429s
                      )
                      print(f"SUCCESS: Model cached at {path}", flush=True)
                      sys.exit(0)
                  except HfHubHTTPError as e:
                      code = getattr(e.response, "status_code", None)
                      if code == 429 or (code and 500 <= code < 600):
                          wait = min(backoff_base * (2 ** (attempt - 1)), 600)
                          print(f"  HTTP {code} — waiting {wait}s before retry", flush=True)
                          time.sleep(wait)
                      else:
                          print(f"  FATAL HTTP error: {e}", flush=True)
                          raise
                  except Exception as e:
                      # Lock errors, transient network errors — retry with backoff
                      wait = min(backoff_base * (2 ** (attempt - 1)), 600)
                      print(f"  Error: {type(e).__name__}: {e}", flush=True)
                      print(f"  Waiting {wait}s before retry", flush=True)
                      time.sleep(wait)

              print(f"FAILED after {max_attempts} attempts", flush=True)
              sys.exit(1)
              PYEOF

              echo ""
              echo "Prefetch complete. Model available at ${HF_HUB_CACHE}"
              find /models -name '*.lock' -delete 2>/dev/null || true
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          volumeMounts:
            - name: model-cache
              mountPath: /models
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: dynamo-model-cache
