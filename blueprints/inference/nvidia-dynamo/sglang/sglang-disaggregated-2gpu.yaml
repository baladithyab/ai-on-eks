#
# SGLang Disaggregated Inference with 2 GPUs per worker (TP=2)
# Uses NIXL for KV cache transfer between prefill and decode workers
# Requires g5.12xlarge (4 GPUs) - 2 for prefill, 2 for decode

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: sglang-disaggregated-2gpu
  namespace: dynamo-cloud
spec:
  backendFramework: sglang
  services:
    Frontend:
      dynamoNamespace: sglang-disaggregated-2gpu
      componentType: frontend
      replicas: 1
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - "exit 0"
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:0.7.0.post1
          workingDir: /workspace/components/backends/sglang
          command: ["sh", "-c"]
          args:
            - "python3 -m dynamo.frontend --http-port=8000"
    SGLangDecodeWorker:
      dynamoNamespace: sglang-disaggregated-2gpu
      envFromSecret: hf-token-secret
      componentType: worker
      subComponentType: decode
      replicas: 1
      livenessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - "exit 0"
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - "exit 0"
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      resources:
        requests:
          cpu: "8"
          memory: "40Gi"
          gpu: "2"
        limits:
          cpu: "8"
          memory: "40Gi"
          gpu: "2"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:0.7.0.post1
          workingDir: /workspace/components/backends/sglang
          command:
            - /bin/sh
            - -c
          args:
            - |
              export LD_LIBRARY_PATH=/usr/local/nvidia/lib64:$LD_LIBRARY_PATH
              export PATH=$PATH:/usr/local/nvidia/bin:/usr/local/nvidia/lib64
              exec python3 -m dynamo.sglang \
                --model-path deepseek-ai/DeepSeek-R1-Distill-Llama-8B \
                --served-model-name deepseek-ai/DeepSeek-R1-Distill-Llama-8B \
                --page-size 16 \
                --tp 2 \
                --trust-remote-code \
                --skip-tokenizer-init \
                --disaggregation-mode decode \
                --disaggregation-transfer-backend nixl \
                --disaggregation-bootstrap-port 12345 \
                --host 0.0.0.0
    SGLangPrefillWorker:
      dynamoNamespace: sglang-disaggregated-2gpu
      envFromSecret: hf-token-secret
      componentType: worker
      subComponentType: prefill
      replicas: 1
      livenessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - "exit 0"
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - "exit 0"
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      resources:
        requests:
          cpu: "8"
          memory: "40Gi"
          gpu: "2"
        limits:
          cpu: "8"
          memory: "40Gi"
          gpu: "2"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:0.7.0.post1
          workingDir: /workspace/components/backends/sglang
          command:
            - /bin/sh
            - -c
          args:
            - |
              export LD_LIBRARY_PATH=/usr/local/nvidia/lib64:$LD_LIBRARY_PATH
              export PATH=$PATH:/usr/local/nvidia/bin:/usr/local/nvidia/lib64
              exec python3 -m dynamo.sglang \
                --model-path deepseek-ai/DeepSeek-R1-Distill-Llama-8B \
                --served-model-name deepseek-ai/DeepSeek-R1-Distill-Llama-8B \
                --page-size 16 \
                --tp 2 \
                --trust-remote-code \
                --skip-tokenizer-init \
                --disaggregation-mode prefill \
                --disaggregation-transfer-backend nixl \
                --disaggregation-bootstrap-port 12345 \
                --host 0.0.0.0