# Hello World DGD — CPU-only Dynamo concepts demo
#
# This is the smallest possible DGD — no GPU, no HuggingFace, no EFS.
# Useful for:
#   - Smoke-testing the Dynamo platform installation post-install.sh
#   - Learning Dynamo architecture (service discovery, componentType,
#     frontend/worker separation) without ML-model complexity
#   - CI validation of the operator + CRDs in minutes, not 30+ min model downloads
#
# Source: mirrors dynamo/examples/custom_backend/hello_world/deploy/hello_world.yaml
# from the upstream Dynamo v1.0.x source tree.

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: hello-world
  namespace: dynamo-system
spec:
  backendFramework: vllm
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo:1.0.1
          workingDir: /workspace/examples/custom_backend/hello_world/
          command:
            - /bin/sh
            - -c
          args:
            - "python3 client.py"
    HelloWorldWorker:
      componentType: worker
      replicas: 1
      resources:
        requests:
          cpu: "1"
          memory: "4Gi"
        limits:
          cpu: "1"
          memory: "4Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo:1.0.1
          workingDir: /workspace/examples/custom_backend/hello_world/
          command:
            - /bin/sh
            - -c
          args:
            - "python3 hello_world.py"
