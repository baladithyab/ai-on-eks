#
# vLLM Aggregated Deployment for Meta Llama 3.3-70B-Instruct
#
# Meta's Llama 3.3 is the latest iteration of the industry-standard open LLM family,
# offering state-of-the-art performance across diverse benchmarks with full
# instruction-following capabilities.
#
# Hardware Requirements:
# - p5.48xlarge (8x H100, 640GB VRAM total) or similar
# - ~140GB VRAM for 70B model weights (TP=8)
# - High-bandwidth GPU interconnect (NVLink preferred)
#
# Features:
# - EFS-backed model cache for fast restarts
# - vLLM backend with tensor parallelism
# - Aggregated single-worker architecture
# - Production-ready health probes
#
# Use cases:
# - Enterprise production inference
# - Complex instruction following
# - Long-context applications (up to 128K tokens)
# - Multi-turn conversations

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-llama-3.3-70b
  namespace: dynamo
spec:
  # Use shared HF cache from EFS
  pvcs:
    - name: dynamo-shared-models
      create: false

  # Set HF_HOME for model caching
  envs:
    - name: HF_HOME
      value: "/models"

  services:
    Frontend:
      componentType: frontend
      replicas: 1
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - 'curl -s http://localhost:8000/health | jq -e ".status == \"healthy\""'
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      volumeMounts:
        - name: dynamo-shared-models
          mountPoint: /models
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.7.1
          workingDir: /workspace/components/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            - "python3 -m dynamo.frontend --http-port 8000"

    VllmWorker:
      envFromSecret: hf-token-secret
      componentType: worker
      replicas: 1
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 30
        failureThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      resources:
        requests:
          cpu: "48"
          memory: "400Gi"
          gpu: "8"
        limits:
          cpu: "48"
          memory: "400Gi"
          gpu: "8"
      sharedMemory:
        size: 24Gi
      volumeMounts:
        - name: dynamo-shared-models
          mountPoint: /models
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: p5-nvidia
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 60
            # 300 * 60s = 5 hours max startup time for large model loading
            failureThreshold: 300
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.7.1
          workingDir: /workspace/components/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            - |
              python3 -m dynamo.vllm \
                --model meta-llama/Llama-3.3-70B-Instruct \
                --tensor-parallel-size 8 \
                --max-model-len 32768 \
                --gpu-memory-utilization 0.90 \
                2>&1 | tee /tmp/vllm.log