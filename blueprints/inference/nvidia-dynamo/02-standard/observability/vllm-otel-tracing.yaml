#
# vLLM Aggregated with OpenTelemetry Distributed Tracing
# Exports traces to Grafana Tempo for end-to-end request tracking
# Uses aggregated architecture (single worker) for efficient resource usage
#
# TEMPO DEPLOYMENT (Optional - required for trace collection):
# If Tempo is not deployed, traces will still be generated but export will fail
# with "BatchSpanProcessor.ExportError: tcp connect error" every 5 seconds.
# This does NOT affect inference functionality.
#
# To deploy Tempo in the observability namespace:
#   kubectl create namespace observability
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm install tempo grafana/tempo \
#     --namespace observability \
#     --set tempo.receivers.otlp.protocols.grpc.endpoint="0.0.0.0:4317"
#
# To disable OTEL export (removes error logs when Tempo not available):
#   Set OTEL_EXPORT_ENABLED to "0" in the envs section below
#
# Trace correlation: Each request gets a unique trace_id visible in logs,
# allowing end-to-end request tracking across frontend and worker.

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-otel
  namespace: dynamo
spec:
  backendFramework: vllm
  # Common environment variables for all services
  envs:
    # Enable JSONL logging (required for OTEL tracing)
    - name: DYN_LOGGING_JSONL
      value: "true"
    # Enable OTEL trace export (set to "0" to disable if Tempo not deployed)
    - name: OTEL_EXPORT_ENABLED
      value: "1"
    # Tempo endpoint (adjust if Tempo is in different namespace/cluster)
    - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: "http://tempo.dynamo.svc.cluster.local:4317"

  services:
    Frontend:
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - 'curl -s http://localhost:8000/health | jq -e ".status == \"healthy\""'
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      componentType: frontend
      replicas: 1
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.7.1
          workingDir: /workspace/components/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            - "python3 -m dynamo.frontend --http-port 8000"
          env:
            # Service name for identifying frontend in traces
            - name: OTEL_SERVICE_NAME
              value: "dynamo-frontend"

    VllmWorker:
      envFromSecret: hf-token-secret
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 30
        failureThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      componentType: worker
      replicas: 1
      resources:
        requests:
          cpu: "10"
          memory: "20Gi"
          gpu: "1"
        limits:
          cpu: "10"
          memory: "20Gi"
          gpu: "1"
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g5-nvidia
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 60
            failureThreshold: 300
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.7.1
          workingDir: /workspace/components/backends/vllm
          command:
            - /bin/sh
            - -c
          args:
            - "python3 -m dynamo.vllm --model Qwen/Qwen3-0.6B 2>&1 | tee /tmp/vllm.log"
          env:
            # Service name for identifying worker in traces
            - name: OTEL_SERVICE_NAME
              value: "dynamo-worker"

