#
# SGLang Disaggregated Multi-Node Deployment
# Tensor Parallelism: TP=8 (2 nodes × 4 GPUs per node)
# Requires Grove and Kai Scheduler enabled in Terraform
# Model: Qwen/Qwen3-0.6B (example - use larger models like 70B for production)

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: sglang-disagg-multinode
  namespace: dynamo-cloud
spec:
  envs:
  - name: HF_TOKEN
    valueFrom:
      secretKeyRef:
        name: hf-token-secret
        key: HF_TOKEN
  - name: GLOO_SOCKET_IFNAME
    value: "eth0"
  # v0.7.0 WORKAROUNDS:
  # - ^gdr_copy: Disable GDRCopy transport to prevent NIXL failures
  # - ^mm: Disable shared memory transport to avoid broadcast deadlock
  # See: https://github.com/ai-dynamo/dynamo/releases/tag/v0.7.0
  - name: UCX_TLS
    value: "^mm,^gdr_copy"
  backendFramework: sglang
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:0.7.0.post1
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "16Gi"

    decode:
      multinode:
        nodeCount: 2  # Deploy across 2 nodes
      envFromSecret: hf-token-secret
      componentType: worker
      replicas: 1
      resources:
        requests:
          cpu: "16"
          memory: "100Gi"
        limits:
          gpu: "4"  # 4 GPUs per node = 8 total (TP=8)
          memory: "100Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:0.7.0.post1
          workingDir: /workspace/components/backends/sglang
          command:
          - python3
          - -m
          - dynamo.sglang
          args:
            - --model-path
            - Qwen/Qwen3-0.6B
            - --served-model-name
            - Qwen/Qwen3-0.6B
            - --tp-size
            - "8"  # Must match nodeCount × GPUs per node
            - --trust-remote-code
            - --skip-tokenizer-init
            - --disaggregation-mode
            - decode
            - --disaggregation-transfer-backend
            - nixl
            - --disaggregation-bootstrap-port
            - "30001"
            - --host
            - "0.0.0.0"
            - --mem-fraction-static
            - "0.82"
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"

    prefill:
      multinode:
        nodeCount: 2  # Deploy across 2 nodes
      envFromSecret: hf-token-secret
      componentType: worker
      replicas: 1
      resources:
        requests:
          cpu: "16"
          memory: "100Gi"
        limits:
          gpu: "4"  # 4 GPUs per node = 8 total (TP=8)
          memory: "100Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:0.7.0.post1
          workingDir: /workspace/components/backends/sglang
          command:
          - python3
          - -m
          - dynamo.sglang
          args:
            - --model-path
            - Qwen/Qwen3-0.6B
            - --served-model-name
            - Qwen/Qwen3-0.6B
            - --tp-size
            - "8"  # Must match nodeCount × GPUs per node
            - --trust-remote-code
            - --skip-tokenizer-init
            - --disaggregation-mode
            - prefill
            - --disaggregation-transfer-backend
            - nixl
            - --disaggregation-bootstrap-port
            - "30001"
            - --mem-fraction-static
            - "0.82"
            - --host
            - "0.0.0.0"
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"

