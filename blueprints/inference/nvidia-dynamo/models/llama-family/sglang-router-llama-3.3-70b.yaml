#
# SGLang Router Architecture for Meta Llama-3.3-70B-Instruct
#
# ROUTER architecture adds intelligent request routing between multiple workers
# based on real-time KV cache metrics and load balancing decisions.
#
# Hardware Requirements:
# - 4x L40S GPUs per worker (TP=4) on g6e.24xlarge
# - Alternatively 8x H100 GPUs (TP=8) on p5.48xlarge
# - Multiple workers recommended for router benefits
# - ~140GB VRAM for 70B model weights (BF16)
# - Meta license acceptance required
#
# Features:
# - EFS-backed model cache for fast restarts
# - Smart router with KV cache-aware load balancing
# - SGLang backend for PCIe multi-GPU compatibility
# - Real-time metrics publishing for routing decisions
# - Industry-standard Llama 3.3 architecture
#
# Architecture:
# - Frontend (DYN_ROUTER_MODE=kv) makes KV cache-aware routing decisions
# - Workers publish KV cache events via ZMQ for routing
# - Multiple workers handle requests in parallel
# - Dynamic load balancing based on KV cache overlap
#
# Use cases:
# - High-throughput production workloads
# - Multi-worker scaling for increased capacity
# - Workloads benefiting from intelligent routing
# - Dynamic scaling with Karpenter

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: sglang-llama-70b-router
  namespace: dynamo
spec:
  pvcs:
    - name: dynamo-model-cache
      create: false
  services:
    Frontend:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      componentType: frontend
      replicas: 1
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - "exit 0"
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      envs:
        - name: DYN_ROUTER_MODE
          value: "kv"
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:0.8.1
          workingDir: /workspace/components/backends/sglang
          command:
            - /bin/sh
            - -c
          args:
            - "python3 -m dynamo.frontend --http-port 8000"

    SglangWorker:
      # Multiple workers with metrics publishing for router
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: worker
      replicas: 2 # Multiple workers for router benefits
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 30
        failureThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      resources:
        requests:
          cpu: "24"
          memory: "150Gi"
          gpu: "4"
        limits:
          cpu: "24"
          memory: "150Gi"
          gpu: "4"
      sharedMemory:
        size: 24Gi
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g7e-nvidia
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 60
            # 300 * 60s = 5 hours max startup time for 70B model loading
            failureThreshold: 300
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:0.8.1
          workingDir: /workspace/components/backends/sglang
          command:
            - /bin/sh
            - -c
          args:
            # SGLang ROUTER MODE: --kv-events-config enables ZMQ KV event publishing
            # for intelligent cache-aware routing via DYN_ROUTER_MODE=kv Frontend
            - |
              python3 -m dynamo.sglang \
                --model-path meta-llama/Llama-3.3-70B-Instruct \
                --served-model-name meta-llama/Llama-3.3-70B-Instruct \
                --tp 4 \
                --trust-remote-code \
                --mem-fraction-static 0.85 \
                --attention-backend flashinfer \
                --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:5557"}' \
                --page-size 16 \
                2>&1 | tee /tmp/sglang-worker.log
