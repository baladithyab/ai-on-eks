#
# SGLang Aggregated Deployment for GPT-OSS-20B
#
# ALTERNATIVE to vLLM for PCIe GPU topologies (g5, g6, g6e instances).
# 
# vLLM with TP>1 on PCIe exhibits shared memory broadcast deadlock
# (shm_broadcast.acquire_read stalls). SGLang uses different multi-GPU
# coordination that may avoid this issue.
#
# Hardware Requirements:
# - 2x L40S GPUs (g6e.12xlarge) or 4x A10G (g5.12xlarge)
# - Using TP=2 for PCIe-based deployments
#
# Features:
# - EFS-backed model cache
# - Reasoning parser (gpt_oss) for chain-of-thought
# - Tool call parser (harmony) for function calling
# - SGLang backend for better PCIe compatibility
#
# Why SGLang over vLLM for PCIe?
# - Different tensor parallelism coordination mechanism
# - May avoid vLLM's shm_broadcast deadlock on PCIe topologies
# - Proven stable on non-NVLink hardware in some configurations

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: sglang-gptoss-20b-agg
  namespace: dynamo
spec:
  # Use shared HF cache from EFS
  pvcs:
    - name: dynamo-shared-models
      create: false

  # Set HF_HOME for model caching
  envs:
    - name: HF_HOME
      value: "/models"

  services:
    Frontend:
      componentType: frontend
      replicas: 1
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - 'curl -s http://localhost:8000/health | jq -e ".status == \"healthy\""'
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
      volumeMounts:
        - name: dynamo-shared-models
          mountPoint: /models
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:0.8.0
          workingDir: /workspace/components/backends/sglang
          command:
            - /bin/sh
            - -c
          args:
            - "python3 -m dynamo.frontend --http-port 8000"

    SglangWorker:
      # AGGREGATED: Single worker handles both prefill and decode
      envFromSecret: hf-token-secret
      componentType: worker
      replicas: 1
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 30
        failureThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      resources:
        requests:
          cpu: "10"
          memory: "40Gi"
          gpu: "2"
        limits:
          cpu: "10"
          memory: "40Gi"
          gpu: "2"
      sharedMemory:
        size: 12Gi
      volumeMounts:
        - name: dynamo-shared-models
          mountPoint: /models
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g6e-nvidia
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 60
            # 300 * 60s = 5 hours max startup time for large model loading
            failureThreshold: 300
          image: nvcr.io/nvidia/ai-dynamo/sglang-runtime:0.8.0
          workingDir: /workspace/components/backends/sglang
          command:
            - /bin/sh
            - -c
          args:
            # SGLang AGGREGATED MODE with reasoning and tool calling support
            - |
              python3 -m dynamo.sglang \
                --model-path openai/gpt-oss-20b \
                --served-model-name openai/gpt-oss-20b \
                --tp 2 \
                --trust-remote-code \
                --mem-fraction-static 0.85 \
                --dyn-reasoning-parser gpt_oss \
                --dyn-tool-call-parser harmony \
                2>&1 | tee /tmp/sglang.log
