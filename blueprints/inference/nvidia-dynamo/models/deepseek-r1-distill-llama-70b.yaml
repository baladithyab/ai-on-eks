# DeepSeek R1 Distill Llama 70B — Reasoning Model on Standard Hardware
#
# Distilled variant of DeepSeek R1 that uses the Llama 3.3 architecture with
# standard GQA (Grouped Query Attention) instead of MLA (Multi-head Latent
# Attention). This means it runs on ANY GPU, unlike the 671B parent model
# which requires Hopper/Blackwell.
#
# Use this blueprint to demonstrate DeepSeek's reasoning capabilities on
# widely-available hardware. For the full 671B MLA-based model, see
# models/deepseek-r1-671b.yaml (requires H100/H200/B200/B300).
#
# Hardware: g7e.12xlarge (2× RTX PRO 6000, 96GB each = 192GB VRAM)
#           TP=2, BF16 weights, ~140GB footprint fits comfortably
#
# Alternative: p5.48xlarge with TP=8 for max throughput
#
# Prerequisites:
#   - Karpenter NodePool: g7e-nvidia
#   - PVC: dynamo-model-cache (EFS-backed, ReadWriteMany)
#   - Secret: hf-token-secret (requires Meta Llama license acceptance)

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: deepseek-r1-distill-llama-70b
  namespace: dynamo-system
spec:
  pvcs:
    - name: dynamo-model-cache
      create: false
  services:
    Frontend:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: frontend
      replicas: 1
      livenessProbe:
        httpGet:
          path: /health
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      readinessProbe:
        exec:
          command:
            - /bin/sh
            - -c
            - "exit 0"
        initialDelaySeconds: 60
        periodSeconds: 60
        timeoutSeconds: 30
        failureThreshold: 10
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.0.1
          command:
            - /bin/sh
            - -c
          args:
            - "python3 -m dynamo.frontend --http-port 8000"

    VllmWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: worker
      replicas: 1
      livenessProbe:
        httpGet:
          path: /live
          port: 9090
        periodSeconds: 5
        timeoutSeconds: 30
        failureThreshold: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 9090
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 60
      resources:
        requests:
          cpu: "16"
          memory: "100Gi"
          gpu: "2"
        limits:
          cpu: "16"
          memory: "100Gi"
          gpu: "2"
      sharedMemory:
        size: 24Gi
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g7e-nvidia
        mainContainer:
          startupProbe:
            httpGet:
              path: /health
              port: 9090
            periodSeconds: 60
            failureThreshold: 300
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          command:
            - /bin/sh
            - -c
          args:
            - |
              python3 -m dynamo.vllm \
                --model deepseek-ai/DeepSeek-R1-Distill-Llama-70B \
                --tensor-parallel-size 2 \
                --max-model-len 8192 \
                --gpu-memory-utilization 0.90 \
                --enforce-eager \
                --dyn-reasoning-parser deepseek_r1 \
                2>&1 | tee /tmp/vllm.log
