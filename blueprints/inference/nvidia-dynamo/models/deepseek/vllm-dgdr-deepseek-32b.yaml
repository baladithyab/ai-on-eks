#
# vLLM DGDR - DeepSeek-R1-Distill-Qwen-32B Online Profiling with EFS Cache
#
# This profiles and auto-deploys DeepSeek-R1-Distill-Qwen-32B:
# - EFS-backed model cache (dynamo-shared-models PVC)
# - Open weights model (no HuggingFace token required)
# - Reasoning-optimized model from DeepSeek R1 distillation
# - Requires 2-4 GPUs with ~80GB combined (TP=2 minimum)
#
# Expected profiling time: 2-3 hours
#
# Prerequisites:
# - dynamo-shared-models PVC created (EFS-backed)
# - g6e.12xlarge or g5.24xlarge (enough VRAM for 32B model)

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeploymentRequest
metadata:
  name: vllm-deepseek-32b
  namespace: dynamo
spec:
  model: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
  backend: vllm

  profilingConfig:
    profilerImage: "nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.8.0"
    # Reference ConfigMap with EFS cache configuration
    configMapRef:
      name: deepseek-32b-dgd-config
      key: disagg.yaml
    config:
      deployment:
        # Model loading timeout
        timeout: 2400  # 40 minutes
      hardware:
        # 32B model needs ~64GB VRAM for BF16
        min_num_gpus_per_engine: 2
        max_num_gpus_per_engine: 4
        num_gpus_per_node: 4
      sweep:
        # Online profiling (AIPerf benchmarks) - required for L40S
        use_ai_configurator: false
      sla:
        # Reasoning-optimized SLA targets (longer outputs expected)
        isl: 2048      # Input sequence length
        osl: 512       # Output sequence length (longer for reasoning)
        ttft: 300.0    # Time To First Token (ms)
        itl: 30.0      # Inter-Token Latency (ms)

  deploymentOverrides:
    workersImage: "nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.8.0"

  autoApply: true
---
# ConfigMap with full DGD base config for DeepSeek-R1-Distill-32B with EFS cache
apiVersion: v1
kind: ConfigMap
metadata:
  name: deepseek-32b-dgd-config
  namespace: dynamo
data:
  disagg.yaml: |
    apiVersion: nvidia.com/v1alpha1
    kind: DynamoGraphDeployment
    metadata:
      name: vllm-disagg
    spec:
      pvcs:
        - name: dynamo-shared-models
          create: false
      envs:
        - name: HF_HOME
          value: "/models"
      services:
        Frontend:
          componentType: frontend
          replicas: 1
          volumeMounts:
            - name: dynamo-shared-models
              mountPoint: /models
          extraPodSpec:
            mainContainer:
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.8.0
        VllmDecodeWorker:
          envFromSecret: hf-token-secret
          componentType: worker
          subComponentType: decode
          replicas: 1
          volumeMounts:
            - name: dynamo-shared-models
              mountPoint: /models
          resources:
            limits:
              gpu: "2"
          extraPodSpec:
            mainContainer:
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.8.0
              workingDir: /workspace/components/backends/vllm
              command:
              - python3
              - -m
              - dynamo.vllm
              args:
                - --model
                - deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
        VllmPrefillWorker:
          envFromSecret: hf-token-secret
          componentType: worker
          subComponentType: prefill
          replicas: 1
          volumeMounts:
            - name: dynamo-shared-models
              mountPoint: /models
          resources:
            limits:
              gpu: "2"
          extraPodSpec:
            mainContainer:
              image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.8.0
              workingDir: /workspace/components/backends/vllm
              command:
              - python3
              - -m
              - dynamo.vllm
              args:
                - --model
                - deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
                - --is-prefill-worker

