#
# MiniMax-M2.7 (230B MoE, 10B active) — Agentic Workflows + Coding
#
# MiniMax-M2.7 is a sparse Mixture-of-Experts model optimized for coding and
# complex agentic tasks. Unlike DeepSeek R1 (which uses MLA), MiniMax-M2.7
# uses multi-head causal self-attention + RoPE + QK RMSNorm — standard
# attention that works on any modern GPU including Ada Lovelace (RTX PRO 6000).
#
# Hardware: g7e.48xlarge (8× RTX PRO 96GB = 768GB VRAM, TP=4)
#           or 4× H100/H200 on p5/p5e.48xlarge
#
# NOTE: Pure TP=8 is NOT supported by MiniMax-M2. Use TP=4 per worker.
#       On g7e.48xlarge (8 GPUs), this means aggregated deployment with
#       --tensor-parallel-size=4 uses 4 of 8 GPUs per pod.
#
# Features:
#   - 230B total / 10B active parameters (4.3% activation rate)
#   - Native FP8 quantization
#   - Multi-Head Attention (MHA) — standard, no MLA
#   - Tool-calling parser: minimax_m2
#   - Reasoning parser: minimax_m2
#   - 200K context window
#
# Prerequisites:
#   - Karpenter NodePool: g7e-nvidia
#   - PVC: dynamo-model-cache (EFS-backed, ReadWriteMany)
#   - Secret: hf-token-secret (HuggingFace token)

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: minimax-m2-7
  namespace: dynamo-system
spec:
  pvcs:
    - name: dynamo-model-cache
      create: false
  services:
    Frontend:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: frontend
      replicas: 1
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.0.1
          command:
            - /bin/sh
            - -c
          args:
            - "python3 -m dynamo.frontend --http-port 8000"

    VllmWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
        - name: dynamo-model-cache
          mountPoint: /models
      envs:
        - name: HF_HOME
          value: /models
        - name: HF_HUB_CACHE
          value: /models
      componentType: worker
      replicas: 1
      resources:
        requests:
          cpu: "32"
          memory: "200Gi"
          gpu: "4"
        limits:
          cpu: "32"
          memory: "200Gi"
          gpu: "4"
      sharedMemory:
        size: 64Gi
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g7e-nvidia
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          command:
            - /bin/sh
            - -c
          args:
            - |
              python3 -m dynamo.vllm \
                --model MiniMaxAI/MiniMax-M2.7 \
                --tensor-parallel-size 4 \
                --max-model-len 32768 \
                --gpu-memory-utilization 0.90 \
                --trust-remote-code \
                --dyn-tool-call-parser minimax_m2 \
                --dyn-reasoning-parser minimax_append_think \
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"
