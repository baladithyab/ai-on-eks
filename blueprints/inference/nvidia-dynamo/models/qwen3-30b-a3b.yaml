#
# vLLM Aggregated Deployment for Qwen3-30B-A3B (Mixture of Experts)
#
# 30B total parameters, 128 experts, 8 active per token (~3B active).
# Hardware: g6e.12xlarge (2x L40S, 96GB VRAM) or g7e with TP=2
# Prerequisites:
#   - Karpenter NodePool: g7e-nvidia
#   - PVC: dynamo-model-cache (EFS-backed, ReadWriteMany)
#   - Secret: hf-token-secret

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-qwen3-30b-a3b
  namespace: dynamo-system
spec:
  pvcs:
  - name: dynamo-model-cache
    create: false
  services:
    Frontend:
      envFromSecret: hf-token-secret
      volumeMounts:
      - name: dynamo-model-cache
        mountPoint: /models
      envs:
      - name: HF_HOME
        value: /models
      - name: HF_HUB_CACHE
        value: /models
      componentType: frontend
      replicas: 1
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/dynamo-frontend:1.0.1
          command:
          - /bin/sh
          - -c
          args:
          - "python3 -m dynamo.frontend --http-port 8000"

    VllmWorker:
      envFromSecret: hf-token-secret
      volumeMounts:
      - name: dynamo-model-cache
        mountPoint: /models
      envs:
      - name: HF_HOME
        value: /models
      - name: HF_HUB_CACHE
        value: /models
      componentType: worker
      replicas: 1
      resources:
        requests:
          cpu: "10"
          memory: "80Gi"
          gpu: "2"
        limits:
          cpu: "10"
          memory: "80Gi"
          gpu: "2"
      sharedMemory:
        size: 12Gi
      extraPodSpec:
        nodeSelector:
          karpenter.sh/nodepool: g7e-nvidia
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.0.1
          command:
          - /bin/sh
          - -c
          args:
          - |
            python3 -m dynamo.vllm \
              --model Qwen/Qwen3-30B-A3B \
              --tensor-parallel-size 2 \
              --max-model-len 16384 \
              --gpu-memory-utilization 0.90 \
              --enforce-eager \
