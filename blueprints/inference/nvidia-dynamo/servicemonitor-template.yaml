#
# ServiceMonitor template for NVIDIA Dynamo deployments (OPT-IN)
# This template creates a Service and ServiceMonitor for per-deployment frontend
# metrics collection via Prometheus Operator.
#
# NOTE: deploy.sh uses PodMonitor (not this template) for metrics collection.
# PodMonitor is the recommended approach because it automatically discovers both
# frontend (port 8000) and worker (port 9090) pods via the operator's
# nvidia.com/metrics-enabled label — no per-deployment setup needed.
#
# Use this ServiceMonitor template only if you need:
#   - Per-deployment job labels in Prometheus (for Grafana dashboard filtering)
#   - A custom Service with a predictable name for port-forwarding
#
# Usage: Replace EXAMPLE_NAME with your deployment name (e.g., vllm-aggregated-default)
#   sed 's/EXAMPLE_NAME/vllm-aggregated-default/g' servicemonitor-template.yaml | kubectl apply -f -
#
# This ServiceMonitor covers frontend metrics only (port 8000, dynamo_frontend_*).
# Worker metrics (dynamo_component_*, vllm:*, port 9090) are only available via PodMonitor.
#
# Reference: https://docs.nvidia.com/dynamo/observability/metrics.html
---
apiVersion: v1
kind: Service
metadata:
  name: EXAMPLE_NAME-frontend
  namespace: dynamo
  labels:
    nvidia.com/dynamo-component: Frontend
    nvidia.com/dynamo-graph-deployment-name: EXAMPLE_NAME
    app.kubernetes.io/name: EXAMPLE_NAME-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: dynamo-blueprints
    app.kubernetes.io/part-of: nvidia-dynamo
    dynamo.nvidia.com/deployment-name: EXAMPLE_NAME
spec:
  ports:
    # Frontend HTTP API port - also exposes /metrics endpoint with dynamo_frontend_* metrics
    - name: http
      port: 8000
      protocol: TCP
      targetPort: 8000
  selector:
    # Use the deployment name label set by the Dynamo operator (reliable for pod matching)
    nvidia.com/dynamo-graph-deployment-name: EXAMPLE_NAME
    nvidia.com/dynamo-component-type: frontend
  type: ClusterIP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: EXAMPLE_NAME-frontend-metrics
  namespace: dynamo
  labels:
    # Required label for Prometheus to discover this ServiceMonitor
    release: kube-prometheus-stack
    app.kubernetes.io/name: dynamo-metrics
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: dynamo-blueprints
    app.kubernetes.io/part-of: nvidia-dynamo
    dynamo.nvidia.com/deployment-name: EXAMPLE_NAME
    example: EXAMPLE_NAME
spec:
  selector:
    matchLabels:
      # Match our Service by deployment name
      nvidia.com/dynamo-graph-deployment-name: EXAMPLE_NAME
  endpoints:
    # Frontend metrics endpoint (HTTP API port 8000)
    # Exposes: dynamo_frontend_* metrics
    # - dynamo_frontend_requests_total: Total LLM requests
    # - dynamo_frontend_time_to_first_token_seconds: TTFT latency histogram
    # - dynamo_frontend_inter_token_latency_seconds: ITL latency histogram
    # - dynamo_frontend_request_duration_seconds: Total request duration
    # - dynamo_frontend_input_sequence_tokens: Input token counts
    # - dynamo_frontend_output_sequence_tokens: Output token counts
    # - dynamo_frontend_inflight_requests: Current inflight requests
    # - dynamo_frontend_queued_requests: Requests in HTTP queue
    # - dynamo_frontend_model_workers: Worker instances per model
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true

  namespaceSelector:
    matchNames:
      - dynamo
