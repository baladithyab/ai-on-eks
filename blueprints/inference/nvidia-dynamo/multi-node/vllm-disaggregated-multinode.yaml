#
# vLLM Disaggregated Multi-Node Deployment
# Tensor Parallelism: TP=8 (2 nodes × 4 GPUs per node)
# Requires Grove and Kai Scheduler enabled in Terraform
# Model: Qwen/Qwen3-0.6B (example - use larger models like 70B for production)

apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-disagg-multinode
  namespace: dynamo-cloud
spec:
  services:
    Frontend:
      dynamoNamespace: vllm-disagg-multinode
      componentType: frontend
      replicas: 1
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.6.0
          workingDir: /workspace/components/backends/vllm
          command:
          - python3
          - -m
          - dynamo.frontend
          args:
            - --http-port
            - "8000"
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "16Gi"

    decode:
      dynamoNamespace: vllm-disagg-multinode
      envFromSecret: hf-token-secret
      componentType: worker
      replicas: 1
      multinode:
        nodeCount: 2  # Deploy across 2 nodes
      resources:
        requests:
          cpu: "16"
          memory: "100Gi"
        limits:
          gpu: "4"  # 4 GPUs per node = 8 total (TP=8)
          memory: "100Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.6.0
          workingDir: /workspace/components/backends/vllm
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
            - --model
            - Qwen/Qwen3-0.6B
            - --tensor-parallel-size
            - "8"  # Must match nodeCount × GPUs per node
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"

    prefill:
      dynamoNamespace: vllm-disagg-multinode
      envFromSecret: hf-token-secret
      componentType: worker
      replicas: 1
      multinode:
        nodeCount: 2  # Deploy across 2 nodes
      resources:
        requests:
          cpu: "16"
          memory: "100Gi"
        limits:
          gpu: "4"  # 4 GPUs per node = 8 total (TP=8)
          memory: "100Gi"
      extraPodSpec:
        mainContainer:
          image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:0.6.0
          workingDir: /workspace/components/backends/vllm
          command:
          - python3
          - -m
          - dynamo.vllm
          args:
            - --model
            - Qwen/Qwen3-0.6B
            - --is-prefill-worker
            - --tensor-parallel-size
            - "8"  # Must match nodeCount × GPUs per node
        tolerations:
          - key: "nvidia.com/gpu"
            operator: "Exists"
            effect: "NoSchedule"

