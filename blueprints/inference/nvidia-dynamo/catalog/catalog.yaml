  # Backwards-compatible aliases (keep existing docs/workflows working)
  - id: vllm
    path: 01-core/vllm/vllm-aggregated-default.yaml
    backend: vllm
    tier: core
    prereqs: "Alias for vllm-aggregated-default"
    notes: "Compatibility ID (use vllm-aggregated-default in docs)"

