# NVIDIA Dynamo example catalog (single source of truth)
#
# This file is intentionally simple YAML so it can be parsed reliably from bash
# without external dependencies.
#
# Fields:
# - id: stable example ID used by ./deploy.sh ./test.sh ./cleanup.sh
# - path: YAML path relative to ai-on-eks/blueprints/inference/nvidia-dynamo/
# - backend: vllm | sglang | trtllm | demo | infra
# - tier: core | standard | advanced | experimental
# - prereqs: short prerequisites string
# - notes: short notes string
#
# Physical Layout (tier-based):
#   01-core/       - Golden path examples, all backends
#   02-standard/   - Production variants
#   03-advanced/   - Large models, DGDR profiling
#   04-experimental/ - Multi-node, specialized
#   _internal/     - Test manifests (not deployed via catalog)

entries:
  # ---------------------------------------------------------------------------
  # CORE (golden path) - 01-core/
  # ---------------------------------------------------------------------------
  - id: hello-world
    path: 01-core/hello-world/hello-world.yaml
    backend: demo
    tier: core
    prereqs: "Dynamo platform installed; no GPU required"
    notes: "Smoke test for platform wiring (no OpenAI HTTP API)"

  - id: vllm-aggregated-default
    path: 01-core/vllm/vllm-aggregated-default.yaml
    backend: vllm
    tier: core
    prereqs: "GPU nodes; hf-token-secret + ngc-secret in dynamo-cloud"
    notes: "Baseline aggregated serving (vLLM)"

  - id: sglang-aggregated-default
    path: 01-core/sglang/sglang-aggregated-default.yaml
    backend: sglang
    tier: core
    prereqs: "GPU nodes; hf-token-secret + ngc-secret in dynamo-cloud"
    notes: "Backend diversity: minimal SGLang 'first success'"

  - id: trtllm-aggregated-default
    path: 01-core/trtllm/trtllm-aggregated-default.yaml
    backend: trtllm
    tier: core
    prereqs: "GPU nodes; hf-token-secret + ngc-secret in dynamo-cloud"
    notes: "Backend diversity: minimal TensorRT-LLM 'first success'"

  - id: vllm-disaggregated-default
    path: 01-core/vllm/vllm-disaggregated-default.yaml
