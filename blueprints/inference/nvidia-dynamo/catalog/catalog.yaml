    prereqs: "GPU nodes; hf-token-secret + ngc-secret in dynamo-cloud"
    notes: "KV-aware routing (router-mode=kv)"

  - id: vllm-disaggregated-kvbm-disk
    path: 01-core/vllm/vllm-disaggregated-kvbm-disk.yaml
    backend: vllm
    tier: core
    prereqs: "GPU nodes; enough RAM + ephemeral disk; hf-token-secret + ngc-secret"
    notes: "KVBM multi-tier KV cache (GPU→CPU→Disk)"

  - id: multi-replica-vllm
    path: 01-core/multi-replica-vllm/multi-replica-vllm.yaml
