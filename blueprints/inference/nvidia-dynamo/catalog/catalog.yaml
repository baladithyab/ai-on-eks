  # Infra (showcase, not deploy.sh-first by default)
  - id: base-model
    path: 01-core/model-management/base-model.yaml
    backend: N/A  # Reference CRD only
    tier: documentation  # CHANGE FROM: core
    category: model-management
    prereqs: "Requires serving DGD with modelRef"
